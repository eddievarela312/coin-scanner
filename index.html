<body>
<div id="app" aria-live="polite"></div>
<div id="pbar" class="pbar" hidden></div>

<script>
// Coin Scanner pricing engine.
// Pure functions only: no network, no DOM. The same file moves into the
// Next.js app unchanged; only the data feeding it changes (sample -> live APIs).
//
// Definitions used everywhere:
//   margin  = profit / sell price   (a 25% margin on a $100 sale = $25 profit)
//   markup is never used, to avoid confusion.

const GRADES = ['VG', 'F', 'VF', 'XF', 'AU', 'UNC'];
const TODAY = new Date('2026-10-05T12:00:00');

const round2 = (n) => Math.round(n * 100) / 100;
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

function percentile(values, p) {
  const s = [...values].sort((a, b) => a - b);
  if (!s.length) return null;
  const i = (s.length - 1) * p;
  const lo = Math.floor(i), hi = Math.ceil(i);
  return s[lo] + (s[hi] - s[lo]) * (i - lo);
}

function median(values) { return percentile(values, 0.5); }

// Melt from actual silver/gold weight (troy oz) and spot ($/oz).
function melt(coin, spot) {
  return round2((coin.asw || 0) * spot.silver + (coin.agw || 0) * spot.gold);
}

// Grades that apply: bullion-type coins price as "ANY" grade.
function gradeKeys(coin, grades) {
  return coin.skipGrade ? ['ANY'] : grades;
}

function salesFor(coin, grades) {
  const keys = gradeKeys(coin, grades);
  return coin.sales.filter((s) => keys.includes(s.grade));
}

// Market range for ONE grade.
//   3+ sales at that grade -> middle half of those sales (25th-75th pct)
//   1-2 sales             -> span of those sales and CPG
//   0 sales, CPG only     -> 85%-100% of CPG (CPG is a retail guide)
//   nothing               -> null ("not enough data")
// Never below melt.
function marketForGrade(coin, grade, spot) {
  const m = melt(coin, spot);
  const prices = coin.sales.filter((s) => s.grade === grade).map((s) => s.price);
  const cpg = coin.cpg ? coin.cpg[grade] : undefined;
  let low, high, basis;
  if (prices.length >= 3) {
    low = percentile(prices, 0.25);
    high = percentile(prices, 0.75);
    basis = `${prices.length} recent sales`;
  } else if (prices.length >= 1 && cpg) {
    const all = [...prices, cpg];
    low = Math.min(...all);
    high = Math.max(...all);
    basis = `${prices.length} sale${prices.length > 1 ? 's' : ''} + CPG`;
  } else if (prices.length >= 1) {
    low = Math.min(...prices);
    high = Math.max(...prices);
    basis = `${prices.length} sale${prices.length > 1 ? 's' : ''} only`;
  } else if (cpg) {
    low = cpg * 0.85;
    high = cpg;
    basis = 'CPG only (retail guide)';
  } else {
    return null;
  }
  return {
    low: round2(Math.max(low, m)),
    high: round2(Math.max(high, m)),
    basis,
    meltFloor: low < m,
  };
}

// Market range across one or more grades (an unconfirmed grade range).
function marketRange(coin, grades, spot) {
  const keys = gradeKeys(coin, grades);
  const parts = keys.map((g) => marketForGrade(coin, g, spot)).filter(Boolean);
  if (!parts.length) return null;
  const low = Math.min(...parts.map((p) => p.low));
  const high = Math.max(...parts.map((p) => p.high));
  return {
    low, high,
    mid: round2((low + high) / 2),
    basis: parts.length > 1 && parts.every((p) => /recent sales$/.test(p.basis))
      ? `${coin.sales.filter((s) => keys.includes(s.grade)).length} recent sales across ${keys[0]}–${keys[keys.length - 1]}`
      : parts.map((p) => p.basis).join(' · '),
    grades: keys,
  };
}

// Target buy: confirmed grade -> midpoint; unconfirmed -> low end (never overpay
// while the grade is still a range).
function targetBuy(range, margin, gradeConfirmed) {
  if (!range) return null;
  const base = gradeConfirmed ? range.mid : range.low;
  return round2(base * (1 - margin));
}

// Liquidity meter, 0-100. Four visible factors so the dealer sees WHY.
function liquidity(coin, spot, range) {
  const m = melt(coin, spot);
  const yearAgo = new Date(TODAY); yearAgo.setFullYear(yearAgo.getFullYear() - 1);
  const recent = coin.sales.filter((s) => new Date(s.date) >= yearAgo);
  const n = recent.length;
  const mid = range ? range.mid : m;

  const velocity = clamp(Math.log(1 + n) / Math.log(1 + 12), 0, 1); // 12+ sales/yr = full
  const meltShare = mid > 0 ? clamp(m / mid, 0, 1) : 0;              // anyone buys metal
  const priceBand = mid <= 100 ? 1 : mid <= 500 ? 0.8 : mid <= 2000 ? 0.55 : 0.35;
  let consistency = 0.4;                                              // unknown -> neutral-low
  const prices = recent.map((s) => s.price);
  if (prices.length >= 3) {
    const mean = prices.reduce((a, b) => a + b, 0) / prices.length;
    const sd = Math.sqrt(prices.reduce((a, b) => a + (b - mean) ** 2, 0) / prices.length);
    consistency = clamp(1 - (sd / mean) / 0.5, 0, 1);
  }

  const factors = [
    { key: 'velocity', label: 'Sales activity', value: velocity, weight: 0.4,
      note: `${n} sale${n === 1 ? '' : 's'} in the last 12 months` },
    { key: 'meltShare', label: 'Metal backing', value: meltShare, weight: 0.25,
      note: `Melt is ${Math.round(meltShare * 100)}% of value` },
    { key: 'consistency', label: 'Price consistency', value: consistency, weight: 0.2,
      note: prices.length >= 3 ? 'Spread of recent sale prices' : 'Too few sales to measure' },
    { key: 'priceBand', label: 'Buyer pool', value: priceBand, weight: 0.15,
      note: mid <= 100 ? 'Under $100: many buyers' : mid <= 500 ? '$100–500' : mid <= 2000 ? '$500–2,000' : 'Over $2,000: fewer buyers' },
  ];
  const score = Math.round(factors.reduce((a, f) => a + f.value * f.weight, 0) * 100);
  const label = score >= 70 ? 'Fast' : score >= 45 ? 'Moderate' : 'Slow';
  const confidence = n >= 6 ? 'High' : n >= 3 ? 'Medium' : 'Low';
  return { score, label, factors, confidence, salesCount: n };
}

// Margin feasibility: can this cost + target margin actually be sold for?
// requiredSell = cost / (1 - margin)
function feasibility(coin, grades, cost, margin, spot) {
  if (!(cost > 0)) return null;
  const requiredSell = round2(cost / (1 - margin));
  const prices = salesFor(coin, grades).map((s) => s.price);
  if (prices.length >= 3) {
    const hits = prices.filter((p) => p >= requiredSell).length;
    const share = hits / prices.length;
    const med = median(prices);
    return {
      requiredSell, basis: 'sales', hits, total: prices.length, share,
      status: share >= 0.6 ? 'Likely' : share >= 0.3 ? 'Possible' : 'Unlikely',
      marginAtMedian: round2((med - cost) / med),
      medianSale: round2(med),
    };
  }
  const keys = gradeKeys(coin, grades);
  const cpgs = keys.map((g) => coin.cpg && coin.cpg[g]).filter(Boolean);
  if (cpgs.length) {
    const cpg = Math.max(...cpgs);
    return {
      requiredSell, basis: 'cpg', cpg,
      status: requiredSell <= cpg * 0.85 ? 'Likely' : requiredSell <= cpg ? 'Possible' : 'Unlikely',
      marginAtMedian: null,
    };
  }
  return { requiredSell, basis: 'none', status: 'Unknown' };
}

// Highest margin the market supports at this cost (using the median sale).
function maxMarginAt(range, cost) {
  if (!range || !(cost > 0)) return null;
  return round2((range.mid - cost) / range.mid);
}

// Purchase / bulk-buy totals.
//   items: [{ cost, low, high, mid, melt, liquidity, sellBasis }]
//   lotOffer: optional single offer for the whole lot (overrides per-coin costs,
//             allocated across coins by expected sale value)
function purchaseTotals(items, margin, lotOffer) {
  const sum = (k) => round2(items.reduce((a, it) => a + (it[k] || 0), 0));
  const low = sum('low'), high = sum('high'), mid = sum('mid'), meltTotal = sum('melt');
  const costEntered = sum('cost');
  const cost = lotOffer > 0 ? lotOffer : costEntered;
  const maxOffer = round2(items.reduce((a, it) => a + it.targetBase * (1 - margin), 0));
  const profitMid = round2(mid - cost);
  const profitLow = round2(low - cost);
  const profitHigh = round2(high - cost);
  const marginMid = mid > 0 ? round2(profitMid / mid) : 0;
  const requiredSell = round2(cost / (1 - margin));
  const status = !(cost > 0) ? 'Unknown'
    : requiredSell <= low ? 'Likely'
    : requiredSell <= high ? 'Possible' : 'Unlikely';
  const scored = items.filter((it) => it.liquidity != null && it.mid > 0);
  const scoredMid = scored.reduce((a, it) => a + it.mid, 0);
  const liq = scored.length
    ? Math.round(scored.reduce((a, it) => a + it.liquidity * it.mid, 0) / scoredMid)
    : null;
  const allocated = items.map((it) => ({
    ...it,
    allocCost: lotOffer > 0 && mid > 0 ? round2(lotOffer * (it.mid / mid)) : it.cost,
  }));
  return { count: items.length, low, high, mid, meltTotal, cost, costEntered, maxOffer,
    profitMid, profitLow, profitHigh, marginMid, requiredSell, status, liquidity: liq, allocated };
}

if (typeof module !== 'undefined') {
  module.exports = { GRADES, melt, marketForGrade, marketRange, targetBuy, liquidity,
    feasibility, maxMarginAt, purchaseTotals, percentile, median };
}

// SAMPLE DATA ONLY. Prices and sales are invented placeholders for the prototype.
// Specs (weight, fineness, ASW/AGW) are approximate. Live data replaces all of this
// once Numista, metals.dev and Greysheet keys are connected.

const SAMPLE_SPOT = { silver: 75.5, gold: 4790, asOf: 'Sample spot' };

const SAMPLE_COINS = [
  {
    id: 'mx-peso-1918',
    name: '1918 Mexico 1 Peso',
    country: 'Mexico', denomination: '1 Peso', year: '1918', mint: 'Mexico City (Mo)',
    composition: 'Silver', fineness: '.800', weight: '18.13 g', diameter: '33 mm',
    asw: 0.4663, mintage: '3,050,000', numista: 'N# sample-1', km: 'KM# 454',
    category: 'World silver', uncertain: ['mint'],
    suggestedGrades: ['VF', 'XF'], gradeSensitive: false, skipGrade: false,
    cpg: { VG: 38, F: 45, VF: 60, XF: 95, AU: 160, UNC: 300 },
    sales: [
      { date: '2026-09-21', grade: 'XF', price: 102 }, { date: '2026-09-02', grade: 'XF', price: 95 },
      { date: '2026-08-14', grade: 'VF', price: 58 }, { date: '2026-07-30', grade: 'XF', price: 108 },
      { date: '2026-07-02', grade: 'XF', price: 91 }, { date: '2026-05-19', grade: 'VF', price: 63 },
      { date: '2026-04-11', grade: 'AU', price: 151 }, { date: '2026-02-27', grade: 'XF', price: 88 },
      { date: '2025-12-09', grade: 'VF', price: 61 },
    ],
    alternates: ['1919 Mexico 1 Peso', '1918 Mexico 50 Centavos'],
  },
  {
    id: 'us-morgan-1921s',
    name: '1921-S Morgan Dollar',
    country: 'United States', denomination: '1 Dollar', year: '1921', mint: 'San Francisco (S)',
    composition: 'Silver', fineness: '.900', weight: '26.73 g', diameter: '38.1 mm',
    asw: 0.7734, mintage: '21,695,000', numista: 'N# sample-2', km: 'KM# 110',
    category: 'US silver dollar', uncertain: ['mint'],
    suggestedGrades: ['AU', 'UNC'], gradeSensitive: true, skipGrade: false,
    cpg: { VG: 62, F: 64, VF: 66, XF: 70, AU: 78, UNC: 115 },
    sales: [
      { date: '2026-09-28', grade: 'AU', price: 74 }, { date: '2026-09-25', grade: 'UNC', price: 98 },
      { date: '2026-09-19', grade: 'AU', price: 76 }, { date: '2026-09-11', grade: 'UNC', price: 120 },

const money = (n) => n == null || isNaN(n) ? '—'
  : n >= 20 || n <= -20 ? (n < 0 ? '-$' : '$') + Math.round(Math.abs(n)).toLocaleString('en-US')
  : '$' + n.toFixed(2);

/* ---------- derived values for one coin ---------- */
// AI-identified coins have no market data yet: value comes from the dealer's
// expected sale price, or else Claude's rough estimate (clearly labeled).
function aiRange(coin, g, expSale) {
  const m = melt(coin, spot());
  const exp = parseFloat(expSale);
  if (exp > 0) return { low: exp, high: exp, mid: exp, basis: 'your expected sale price', grades: g, source: 'dealer' };
  const cpg = g.map((k) => coin.cpg && coin.cpg[k]).filter((v) => v > 0);
  if (cpg.length) {
    const lo = Math.max(Math.min(...cpg) * 0.85, m), hi = Math.max(Math.max(...cpg), m);
    return { low: lo, high: hi, mid: Math.round((lo + hi) / 2 * 100) / 100, basis: 'CPG retail (85–100%), via CDN', grades: g, source: 'cpg' };
  }
  const nv = g.map((k) => coin.numistaVal && coin.numistaVal[k]).filter((v) => v > 0);
  if (nv.length) {
    const lows = g.map((k) => coin.numistaLow && coin.numistaLow[k]).filter((v) => v > 0 && v < Infinity);
    const lo = Math.max(Math.min(...(lows.length ? lows : nv)), m), hi = Math.max(Math.max(...nv), m);
    return { low: lo, high: hi, mid: Math.round((lo + hi) / 2 * 100) / 100, basis: coin.varieties ? 'Numista price estimates, covering all varieties of this year' : 'Numista price estimates', grades: g, source: 'numista' };
  }
  const parts = g.map((k) => coin.aiValue && coin.aiValue[k]).filter((v) => Array.isArray(v) && v.length === 2 && v[1] > 0);
  if (!parts.length) return null;
  const low = Math.max(Math.min(...parts.map((p) => +p[0])), m);
  const high = Math.max(Math.max(...parts.map((p) => +p[1])), m);
  return { low, high, mid: Math.round((low + high) / 2 * 100) / 100, basis: 'Claude\'s rough estimate, not market data', grades: g, source: 'ai' };
}

function analyze(coin, grades, confirmed, costInput, marginOverride, expSale) {
  const m = marginOverride ?? marginFor(coin);
  const g = coin.skipGrade ? ['ANY'] : grades;
  const isConfirmed = coin.skipGrade || confirmed;
  const isAI = coin.source === 'ai';
  const range = isAI ? aiRange(coin, g, expSale) : marketRange(coin, g, spot());
  const tb = targetBuy(range, m, isConfirmed);
  const hideTarget = coin.gradeSensitive && !isConfirmed;
  const cost = parseFloat(costInput);
  const effCost = cost > 0 ? cost : tb;
  const liq = isAI ? null : liquidity(coin, spot(), range);
  const feas = effCost > 0 && (!isAI || (range && range.source === 'cpg')) ? feasibility(coin, g, effCost, m, spot()) : null;
  return {
    isAI, margin: m, grades: g, confirmed: isConfirmed, range, targetBuy: tb, hideTarget, liq, feas,
    melt: melt(coin, spot()), cost: cost > 0 ? cost : null, effCost,
    profitLow: range && effCost ? range.low - effCost : null,
    profitHigh: range && effCost ? range.high - effCost : null,
    maxMargin: maxMarginAt(range, effCost),
    targetBase: range ? (isConfirmed ? range.mid : range.low) : 0,
    cpg: g.map((k) => coin.cpg && coin.cpg[k]).filter(Boolean),
  };
}

function feasBlock(a, coin) {
  const f = a.feas;
  if (!f) return '';
  let body;
  if (f.basis === 'sales') {
    body = `<b>${f.hits} of ${f.total}</b> recent sales ${a.grades.length > 1 ? 'in this grade range' : coin.skipGrade ? '' : 'at this grade'} were ${money(f.requiredSell)} or more.`;

    body = `Not enough sales yet. Compared with CPG retail of ${money(f.cpg)}.`;
  } else body = 'No sales or CPG data to check against.';
  return `<div class="feas ${tone(f.status)}">
    <div class="row between"><b>Your ${pct(a.margin)} margin</b><span class="pill ${tone(f.status)}">${f.status}</span></div>

function lotTotals() {

    return { ...it, coin, a };
  });
  const defMargin = (() => {
    const tot = rows.reduce((s, r) => s + (r.a.range ? r.a.range.mid : 0), 0);
    if (!tot) return S.settings.marginNumis;
    return Math.round(rows.reduce((s, r) => s + marginFor(r.coin) * (r.a.range ? r.a.range.mid : 0), 0) / tot * 100) / 100;
  })();
  const margin = P.lotMargin ?? defMargin;
  const items = rows.map((r) => ({
    cost: r.cost, low: r.a.range ? r.a.range.low : 0, high: r.a.range ? r.a.range.high : 0,
    mid: r.a.range ? r.a.range.mid : 0, melt: r.a.melt, liquidity: r.a.liq ? r.a.liq.score : null, targetBase: r.a.targetBase,
    coin: r.coin, thumb: r.thumb, gradeTxt: gradeLabel(r.coin, r.a.grades) + (r.coin.skipGrade || r.confirmed ? '' : ' (suggested)'),
    liqLabel: r.a.liq ? r.a.liq.label : 'No sales data',
  }));
  const T = purchaseTotals(items, margin, parseFloat(P.lotOffer) || 0);
  return { ...T, margin };
}

function shrink(file, max, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => cb(null);
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function blobToBase64(b) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(b);
  });
}
/* ---------- verified data: Numista specs + Greysheet CPG ---------- */
const BUCKET = (n) => n >= 60 ? 'UNC' : n >= 50 ? 'AU' : n >= 40 ? 'XF' : n >= 20 ? 'VF' : n >= 12 ? 'F' : n >= 8 ? 'VG' : null;
const NUMISTA_GRADE = { vg: 'VG', f: 'F', vf: 'VF', xf: 'XF', ef: 'XF', au: 'AU', unc: 'UNC', bu: 'UNC' };

function mergeLookup(coin, L) {
  if (!coin || !L) return;
  coin.lookup = L;
  const n = L.numista;
  if (n && n.matched) {
    coin.numista = `N# ${n.id}`; coin.numistaUrl = n.url; coin.numistaTitle = n.title;
    if (n.km) coin.km = n.km;
    if (n.composition) coin.composition = n.composition;
    if (n.weight_g) coin.weight = n.weight_g + ' g';
    if (n.size_mm) coin.diameter = n.size_mm + ' mm';
    if (n.issue && n.issue.mintage) coin.mintage = Number(n.issue.mintage).toLocaleString('en-US');
    coin.refImages = [n.obverse_thumb, n.reverse_thumb].filter(Boolean).map((u) => '/api/img?u=' + encodeURIComponent(u));
    coin.varieties = n.issue && n.issue.varieties ? n.issue.varieties : null;
    // Recompute precious-metal content from Numista weight + fineness when both are clear.
    const fm = String(n.composition || '').match(/(?:0?\.(\d{3,4}))|(\b9\d{2}\b)/);
    const fine = fm ? parseFloat(fm[1] ? '0.' + fm[1] : '0.' + fm[2]) : null;
    if (n.weight_g && fine && fine > 0.3 && fine <= 1) {
      const pure = Math.round(n.weight_g * fine / 31.1035 * 10000) / 10000;
      if (/gold/i.test(n.composition)) { coin.agw = pure; coin.asw = null; }
      else if (/silver/i.test(n.composition)) { coin.asw = pure; coin.agw = null; }
    }
    const nv = {}, nvLow = {};
    for (const p of n.prices || []) {
      const g = NUMISTA_GRADE[String(p.grade).toLowerCase()]; if (!g) continue;
      nv[g] = Math.max(nv[g] || 0, p.price);
      nvLow[g] = Math.min(nvLow[g] || Infinity, p.low || p.price);
    }
    coin.numistaVal = nv; coin.numistaLow = nvLow;
  }
  const g = L.greysheet;
  if (g && g.prices && g.prices.length && g.name_check !== false) {
    coin.gsName = g.name; coin.gsid = g.gsid; coin.pcgs = g.pcgs;
    const by = {}, grey = {};
    for (const r of g.prices) {
      const b = BUCKET(r.grade || parseInt(String(r.label || '').replace(/\D/g, ''), 10) || 0);
      if (!b) continue;
      if (r.cpg) (by[b] = by[b] || []).push(r.cpg);
      if (r.grey) (grey[b] = grey[b] || []).push(r.grey);
    }
    coin.cpg = Object.fromEntries(Object.entries(by).map(([k, v]) => [k, median(v)]));
    coin.cpgRange = Object.fromEntries(Object.entries(by).map(([k, v]) => [k, [Math.min(...v), Math.max(...v)]]));
    const allCpg = g.prices.map((r) => r.cpg).filter(Boolean);
    if (allCpg.length) coin.cpg.ANY = Math.min(...allCpg);
    coin.grey = Object.fromEntries(Object.entries(grey).map(([k, v]) => [k, median(v)]));
  } else if (g && g.prices && g.name_check === false) {
    coin.gsMismatch = g.name;
  }
}

async function fetchLookup(coin, raw) {
  if (!SERVER_MODE) return;
  coin.lookupPending = true;
  try {
    const res = await fetch('/api/lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Access-Code': store.get('cs.code', ''), 'X-Admin-Code': store.get('cs.admin', '') },
      body: JSON.stringify({ coin: raw }),
    });
    const L = await res.json().catch(() => null);
    if (res.ok && L) mergeLookup(coin, L);
  } catch (_) {}
  coin.lookupPending = false;
  if (S.coin === coin && ['fields', 'match', 'grade', 'money', 'details'].includes(S.screen)) render();
}

function sendFeedback(patch) {
  if (!SERVER_MODE || !patch.scan_id) return;
  fetch('/api/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Access-Code': store.get('cs.code', '') },
    body: JSON.stringify(patch),
  }).catch(() => {});
}
async function serverJson(hints, images, signal) {
  const payload = { hints: hints || '', images: await Promise.all(images.map(blobToBase64)) };
  const res = await fetch('/api/identify', {
    method: 'POST', signal,
    headers: { 'Content-Type': 'application/json', 'X-Access-Code': store.get('cs.code', ''), 'X-Tester': store.get('cs.tester', '') },
    body: JSON.stringify(payload),
  }).catch((e) => { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'network' }; });
  if (res.status === 401) throw { code: 'need_code' };
  if (res.status === 413) throw { code: 'image_rejected' };
  if (res.status === 429) throw { code: 'rate_limited' };
  const data = await res.json().catch(() => null);
  if (!res.ok || !data) throw { code: (data && data.error) || 'upstream_error', detail: data ? data.detail : `Server returned ${res.status}` };
  return data;
}
let idCtl = null, idTimer = null;

const ID_PROMPT = (hints) => `You are an expert numismatist helping a coin dealer identify a coin at a coin show.
${S.files.rev ? 'Image 1 is the obverse (front); image 2 is the reverse (back).' : S.files.obv ? 'The image shows one side of the coin.' : 'No photos: identify from the dealer\'s details only.'}
The coin may be raw or in a PCGS, NGC, ANACS or other slab. If slabbed, read the label: service, grade, cert number, label text.

Read every legend, the date and the mint mark carefully. Check where the mint mark sits for this series (for example, Morgan dollars: reverse, below the wreath). Never invent a mint mark you cannot see. If no mint mark is visible where the series would show one, use "None". If you cannot read something, list it in uncertain_fields and lower your confidence. Prefer an honest "Low" over a confident wrong answer.
${hints ? '\nThe dealer has corrected or supplied these details; treat them as correct unless the photos clearly contradict them:\n' + hints + '\n' : ''}
Reply with only this JSON object:
{
 "identified": true,
 "coin_name": "e.g. 1921-S Morgan Dollar",
 "country": "", "denomination": "", "year": "",
 "mint_mark": "letter, or \"None\", or \"\" if unreadable",
 "mint_name": "e.g. San Francisco",
 "km_number": "Krause KM# if known, else \"\"",
 "series": "e.g. Morgan Dollar, Libertad, Walking Liberty Half",
 "numista_query": "2-4 words that appear in the coin's Numista catalog title, e.g. \"Morgan Dollar\" or \"Onza Libertad\"",
 "pcgs_number": "PCGS coin number for this exact date/mint/variety ONLY if you are confident, else \"\"",
 "composition": "", "fineness": "e.g. .900", "weight_g": null, "asw_oz": null, "agw_oz": null, "diameter_mm": null, "mintage": "",
 "is_bullion_like": false,
 "grade_sensitive": false,
 "slab": null,
 "suggested_grades": ["VF", "XF"],
 "grade_note": "one short sentence on visible wear",
 "uncertain_fields": ["mint_mark"],
 "confidence": "High",
 "candidates": [{"coin_name": "", "why": ""}],
 "rough_value_usd": {"VF": [60, 80]},
 "photo_feedback": ""
}
Rules:
- identified: false if you cannot tell what the coin is.
- uncertain_fields uses only: country, denomination, year, mint_mark.
- is_bullion_like: true when value is mostly metal (90% US silver in circulated grades, modern bullion, gold bullion coins). Then suggested_grades is [] and rough_value_usd uses the key "ANY".
- grade_sensitive: true when one grade step changes value a lot (key dates, mint-state Morgans, high-grade type coins).
- slab: null, or {"service": "PCGS", "grade": "MS63", "cert": "", "label_text": "", "pcgs_number": "", "ngc_id": ""}. On PCGS labels the coin number is printed with the cert (e.g. "7296.63/12345678": coin number 7296, grade 63). Copy numbers exactly as printed; leave "" if not readable.
- suggested_grades: one or two adjacent grades from VG, F, VF, XF, AU, UNC.
- candidates: 2 to 4 OTHER likely coins, including close dates, mint marks and varieties, each with a short reason.
- rough_value_usd: approximate typical US retail ranges for the grades in question, from general knowledge, only where you have a reasonable sense; otherwise {}. These are shown to the dealer labeled as rough estimates.
- weights in grams, ASW/AGW in troy ounces.
- photo_feedback: one short tip if the photos limited you (glare, blur, too small), else "".`;

function hintsFromFields() {
  if (!S.fields) return '';
  const f = S.fields, parts = [];
  if (f.country) parts.push('Country: ' + f.country);
  if (f.denomination) parts.push('Denomination: ' + f.denomination);
  if (f.year) parts.push('Year: ' + f.year);
  if (f.mint) parts.push('Mint mark: ' + f.mint);
  return parts.join('\n');
}

const GRADE_MAP = (g) => {
  const x = String(g || '').toUpperCase();
  if (/^(MS|PR|PF|SP|UNC|BU)/.test(x)) return 'UNC';
  if (/^AU/.test(x)) return 'AU';
  if (/^(XF|EF)/.test(x)) return 'XF';
  if (/^VF/.test(x)) return 'VF';
  if (/^F/.test(x)) return 'F';
  if (/^(VG|G|AG|FR|P)/.test(x)) return 'VG';
  return null;
};

function coinFromAI(r) {
  const fieldName = { mint_mark: 'mint', year: 'year', country: 'country', denomination: 'denomination' };
  const num = (v) => (typeof v === 'number' && isFinite(v) && v > 0) ? v : null;
  const sugg = Array.isArray(r.suggested_grades) ? r.suggested_grades.filter((g) => GRADES.includes(g)) : [];
  const mint = r.mint_mark === 'None' ? 'None' + (r.mint_name ? ` (${r.mint_name})` : '') : [r.mint_mark, r.mint_name ? `(${r.mint_name})` : ''].filter(Boolean).join(' ');
  return {
    id: 'ai-' + Date.now(), source: 'ai',
    name: r.coin_name || [r.year, r.country, r.denomination].filter(Boolean).join(' ') || 'Unknown coin',
    country: r.country || '', denomination: r.denomination || '', year: r.year || '', mint,
    composition: r.composition || '', fineness: r.fineness || '',
    weight: num(r.weight_g) ? r.weight_g + ' g' : '', diameter: num(r.diameter_mm) ? r.diameter_mm + ' mm' : '',
    asw: num(r.asw_oz), agw: num(r.agw_oz), mintage: r.mintage || '', km: r.km_number || '',
    numista: 'Matched once Numista is connected',
    category: r.is_bullion_like ? 'Bullion-type' : 'Numismatic',
    uncertain: (r.uncertain_fields || []).map((f) => fieldName[f]).filter(Boolean),
    suggestedGrades: sugg, gradeSensitive: !!r.grade_sensitive, skipGrade: !!r.is_bullion_like,
    cpg: {}, sales: [],
    alternates: (r.candidates || []).filter((x) => x && x.coin_name).slice(0, 4),
    aiValue: r.rough_value_usd && typeof r.rough_value_usd === 'object' ? r.rough_value_usd : {},
    slab: r.slab && (r.slab.service || r.slab.grade) ? r.slab : null,
    gradeNote: r.grade_note || '', confidence: ['High', 'Medium', 'Low'].includes(r.confidence) ? r.confidence : 'Medium',
    photoFeedback: r.photo_feedback || '',
  };
}

const ID_ERRORS = {
  not_granted: 'Claude isn\'t allowed for this page yet. Allow it when asked, or check the page\'s permissions.',
  sampling_disabled: 'Claude isn\'t available for this account.',
  rate_limited: 'Too many scans at once, or your Claude usage limit was reached. Wait a moment and try again.',
  image_rejected: 'That photo couldn\'t be read. Try a JPEG or PNG photo.',
  refused: 'Claude declined these photos. Try different photos.',
  invalid_json: 'The answer came back garbled. Try again.',
  session_expired: 'Your Claude session expired. Sign in again.',
  network: 'No connection to the server. Check your signal and try again.',
  no_credit: 'Your Anthropic account has no credit. Add credit at console.anthropic.com under Billing, then scan again.',
  not_configured: 'The app\'s API key isn\'t set up yet. Add ANTHROPIC_API_KEY in Vercel settings and redeploy.',
};

async function runIdentify(hints, opts = {}) {
  if (SERVER_MODE && !store.get('cs.code', '')) { S.pending = { hints, opts }; return go('code'); }
  const sample = SERVER_MODE ? null : await samplePromise;
  if (!SERVER_MODE && !sample) { S.idUnavailable = true; return go('pick'); }
  const caps = SERVER_MODE ? { images: { maxCount: 2 } } : await sample.limits().catch(() => null);
  const taken = [S.files.obv, S.files.rev].filter(Boolean);
  if (taken.length && !opts.textOnly && !(caps && caps.images)) {
    S.idError = 'This view of Claude can\'t send photos yet. Open this page at claude.ai in Safari or on a computer and scan again. You can also enter the details you can read and search.';
    S.ai = null;
    return go('idfail');
  }
  const images = !opts.textOnly ? taken.slice(0, caps.images.maxCount) : [];
  if (taken.length && !opts.textOnly && !images.length) {
    S.idError = 'The photos couldn\'t be prepared. Try taking them again.';
    return go('idfail');
  }
  idCtl = new AbortController();
  const t0 = Date.now();
  S.screen = 'identifying'; render();
  clearInterval(idTimer);
  idTimer = setInterval(() => { const el = document.getElementById('elapsed'); if (el) el.textContent = Math.round((Date.now() - t0) / 1000); }, 1000);
  try {
    const r = SERVER_MODE
      ? await serverJson(hints, images, idCtl.signal)
      : await sample.json(ID_PROMPT(hints), { images: images.length ? images : undefined, signal: idCtl.signal, modelTier: 'default', cache: false });
    S.idSeconds = Math.round((Date.now() - t0) / 1000);
    S.ai = r; S.idDetail = ''; S.scanId = r.scan_id || null;
    if (!r || r.identified === false || !r.coin_name) {
      S.idError = 'Claude couldn\'t tell what this coin is from these photos.';
      return go('idfail');
    }
    S.coin = coinFromAI(r);
    fetchLookup(S.coin, r);
    S.fields = { country: S.coin.country, denomination: S.coin.denomination, year: S.coin.year, mint: S.coin.mint };
    S.expSale = ''; S.cost = ''; S.candidates = false; S.manual = false;
    S.log.push({ at: new Date().toISOString(), hints: hints || '', result: r.coin_name, confidence: r.confidence, seconds: S.idSeconds });
    go(opts.next || 'fields');
  } catch (e) {
    if (e && e.code === 'cancelled') return go('capture');
    if (e && e.code === 'need_code') { store.set('cs.code', ''); S.codeWrong = true; S.pending = { hints, opts }; return go('code'); }
    if (e && e.code === 'images_unavailable') { S.idError = 'This view of Claude can\'t send photos yet. Open this page at claude.ai in Safari or on a computer and scan again.'; S.ai = null; return go('idfail'); }
    S.idError = ID_ERRORS[e && e.code] || 'Something went wrong reaching Claude. Try again.';
    S.idDetail = e && e.detail ? String(e.detail).slice(0, 300) : '';
    go('idfail');
  } finally {
    clearInterval(idTimer);
  }
}
function startIdentify() { runIdentify(''); }
function waitForFiles() {
  return new Promise((resolve) => {
    let n = 0;
    const tick = () => (S.files.obv !== null && S.files.rev !== null) || n++ > 40 ? resolve() : setTimeout(tick, 100);
    setTimeout(tick, 300);
  });
}

// Re-encode any camera photo (HEIC, huge JPEG, etc.) as a standard JPEG Blob.
function toJpegBlob(file, max) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob((b) => resolve(b), 'image/jpeg', 0.9);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled) return;
  const a = t.dataset.a;
  if (a === 'go') return go(t.dataset.s);
  if (a === 'back') return go(prevScreen);
  if (a === 'scan') { Object.assign(S, { photos: {}, files: {}, coin: null, fields: null, ai: null, cost: '', expSale: '', added: false, candidates: false, feedback: null, confirmClear: false, manual: false, idUnavailable: false }); return go('capture'); }
  if (a === 'demo') { Object.assign(S, { photos: {}, files: {}, coin: null, cost: '', expSale: '', added: false, candidates: false, feedback: null, idUnavailable: false }); return go('pick'); }
  if (a === 'saveCode') {
    const v = document.getElementById('code').value.trim();
    if (!v) return;
    store.set('cs.code', v); S.codeWrong = false;
    const tn = document.getElementById('tester').value.trim(); if (tn) store.set('cs.tester', tn);
    const p = S.pending || { hints: '', opts: {} }; S.pending = null;
    return runIdentify(p.hints, p.opts);
  }
  if (a === 'frontOnly') return waitForFiles().then(startIdentify);
  if (a === 'stopId') { if (idCtl) idCtl.abort(); return; }
  if (a === 'researchId') return runIdentify(hintsFromFields(), { textOnly: !S.files.obv });
  if (a === 'pickCandidate') {
    const cand = S.coin.alternates[+t.dataset.i];
    return runIdentify(`The dealer says this coin is: ${cand.coin_name}. Re-check the photos against that and fill in its details.`, { next: 'match', textOnly: !S.files.obv });
  }
  if (a === 'manual') {
    S.manual = true;
    S.coin = { source: 'ai', uncertain: [], alternates: [] };
    S.fields = S.fields || { country: '', denomination: '', year: '', mint: '' };
    return go('fields');
  }
  if (a === 'pickCoin') {
    S.coin = coinById(t.dataset.id);
    S.fields = { country: S.coin.country, denomination: S.coin.denomination, year: S.coin.year, mint: S.coin.mint };
    return go('fields');
  }
  if (a === 'toMatch') {
    S.candidates = false;
    if (S.manual || !S.coin || !S.coin.name) return runIdentify(hintsFromFields(), { next: 'match', textOnly: !S.files.obv });
    const c = S.coin;
    const edited = c.source === 'ai' && ['country', 'denomination', 'year', 'mint'].some((k) => (S.fields[k] || '') !== (c[k] || ''));
    if (edited) return runIdentify(hintsFromFields(), { next: 'match' });
    return go('match');
  }
  if (a === 'showCandidates') { S.candidates = true; return render(); }
  if (a === 'hideCandidates') { S.candidates = false; return render(); }
  if (a === 'confirmMatch') {
    S.candidates = false;
    if (S.wrongScanId && S.coin && S.coin.name && S.wrongScanId !== S.scanId) {
      sendFeedback({ scan_id: S.wrongScanId, corrected_to: S.coin.name });
      sendFeedback({ scan_id: S.scanId, correct: 'yes' });
      S.wrongScanId = null;
    }
    if (S.coin.skipGrade) { S.grades = ['ANY']; S.confirmed = true; return go('money'); }
    const slabGrade = S.coin.slab && GRADE_MAP(S.coin.slab.grade);
    if (slabGrade) { S.grades = [slabGrade]; S.confirmed = true; return go('money'); }
    return go('grade');
  }
  if (a === 'setGrade') { S.grades = [t.dataset.g]; S.confirmed = true; return go('money'); }
  if (a === 'useRange') { S.grades = S.coin.suggestedGrades && S.coin.suggestedGrades.length ? [...S.coin.suggestedGrades] : ['F', 'VF']; S.confirmed = false; return go('money'); }
  if (a === 'fb') {
    S.feedback = t.dataset.v;
    if (S.log.length) S.log[S.log.length - 1].correct = t.dataset.v;
    sendFeedback({ scan_id: S.scanId, correct: t.dataset.v });
    if (t.dataset.v === 'no') { S.wrongScanId = S.scanId; return go('fields'); }
    return render();
  }
  if (a === 'addToPurchase') {
    const an = analyze(S.coin, S.grades, S.confirmed, S.cost, null, S.expSale);
    const cost = an.cost ?? an.targetBuy ?? 0;
    const item = { coinId: S.coin.id, grades: [...S.grades], confirmed: S.confirmed, cost: Math.round(cost * 100) / 100, thumb: S.photos.thumb || null };
    if (S.coin.source === 'ai') { item.coin = S.coin; item.expSale = S.expSale; }
    S.purchase.items.push(item);
    S.added = true; save(); return render();
  }
  if (a === 'removeItem') { S.purchase.items.splice(+t.dataset.i, 1); save(); return render(); }
  if (a === 'askClear') { S.confirmClear = true; return render(); }
  if (a === 'cancelClear') { S.confirmClear = false; return render(); }
  if (a === 'doClear') { S.purchase = { no: S.purchase.no + 1, items: [], lotOffer: '', lotMargin: null }; S.confirmClear = false; save(); return go('home'); }
  if (a === 'saveSettings') {
    const v = (id) => parseFloat(document.getElementById(id).value);
    if (v('mn') >= 0 && v('mn') < 100) S.settings.marginNumis = v('mn') / 100;
    if (v('mb') >= 0 && v('mb') < 100) S.settings.marginBullion = v('mb') / 100;
    if (v('ss') > 0) S.settings.spot.silver = v('ss');
    if (v('sg') > 0) S.settings.spot.gold = v('sg');
    S.settings.spot.asOf = 'Sample spot, edited';
    const admEl = document.getElementById('adm'); if (admEl) store.set('cs.admin', admEl.value.trim());
    save(); return go(prevScreen);
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.field) { S.fields[el.dataset.field] = el.value; return; }
  if (el.id === 'cost') {
    S.cost = el.value;
    const a = analyze(S.coin, S.grades, S.confirmed, S.cost, null, S.expSale);
    const calc = document.getElementById('calc');
    const pos = el.selectionStart;
    calc.innerHTML = calcInner(S.coin, a);
    const ab = document.getElementById('addBtn'); if (ab) ab.disabled = a.hideTarget && !a.cost;
    const ni = document.getElementById('cost'); ni.focus(); try { ni.setSelectionRange(pos, pos); } catch (_) {}
    return;
  }
  if (el.id === 'expsale') {
    S.expSale = el.value;
    return;
  }
  if (el.id === 'lot') {
    S.purchase.lotOffer = el.value; save();
    const box = document.getElementById('lotcalc');
    box.innerHTML = lotCalcInner(lotTotals());
    const ni = document.getElementById('lot'); ni.focus();
    return;
  }
  if (el.id === 'lm') {
    S.purchase.lotMargin = parseFloat(el.value); save();
    document.getElementById('lmv').textContent = pct(S.purchase.lotMargin);
    return;
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if ((el.id === 'cam' || el.id === 'lib') && el.files && el.files[0]) {
    const side = S.photos.obv ? 'rev' : 'obv';
    const file = el.files[0];
    S.files[side] = null;
    toJpegBlob(file, 1600).then((b) => { S.files[side] = b; });
    shrink(file, 900, (url) => {
      if (!url) return;
      S.photos[side] = url;
      if (side === 'obv') shrink(file, 96, (th) => { S.photos.thumb = th; });
      render();
      if (side === 'rev') waitForFiles().then(startIdentify);
    });
  }
  if (el.dataset.cost != null) {
    const i = +el.dataset.cost, v = parseFloat(el.value);
    if (v >= 0) { S.purchase.items[i].cost = v; save(); render(); }
  }
  if (el.id === 'lm') render();
  if (el.id === 'expsale') render();
});

render();
