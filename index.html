<style>
/* Layout: one phone-width column, decision numbers first, detail one tap deeper. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e4e8ed; --ink:#141a22; --muted:#5b6673; --line:#d4dae1;
  --accent:#8a5a12; --accent-soft:#f3e7d2; --accent-ink:#ffffff;
  --good:#1f7a4d; --good-soft:#dcefe4; --warn:#9a6200; --warn-soft:#f6ead2; --bad:#b3322c; --bad-soft:#f6dcda;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#171d25; --sunk:#11161c; --ink:#e8ecf1; --muted:#93a0ad; --line:#29323d;
  --accent:#e0ac4f; --accent-soft:#3a2d17; --accent-ink:#1a1206;
  --good:#4cc38a; --good-soft:#163527; --warn:#f0b44c; --warn-soft:#3a2c12; --bad:#f07167; --bad-soft:#3d1c1a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#171d25; --sunk:#11161c; --ink:#e8ecf1; --muted:#93a0ad; --line:#29323d;
  --accent:#e0ac4f; --accent-soft:#3a2d17; --accent-ink:#1a1206;
  --good:#4cc38a; --good-soft:#163527; --warn:#f0b44c; --warn-soft:#3a2c12; --bad:#f07167; --bad-soft:#3d1c1a;
  color-scheme:dark;}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 120px;-webkit-font-smoothing:antialiased}
#app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:12px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem;line-height:1.05}
h2{font-size:1.45rem;line-height:1.15}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-data);font-size:.82rem}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-size:1.05rem}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:15px 18px;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:52px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-link{background:none;color:var(--accent);padding:8px 0;min-height:0;font-weight:600}
.btn-wide{width:100%}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible,label:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.back{background:none;border:0;color:var(--muted);padding:8px 0;min-height:44px;font-weight:600}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

input[type=text],input[type=number]{font:inherit;width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:50px}

label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.flag{color:var(--warn);font-weight:700;font-size:.78rem}
/* Capture */
.capture{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:20px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}

.list{display:flex;flex-direction:column}

.list button:disabled{opacity:.5;cursor:not-allowed}
/* Grade chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;min-height:56px;font-family:var(--f-display);font-size:1.15rem}
.chip.sugg{border-color:var(--accent);background:var(--accent-soft)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* Meter */
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--warn) 50%,var(--good))}
.meter i{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.factor{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.85rem}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}

/* Tables */
.tablewrap{overflow-x:auto}

td.r,th.r{text-align:right}
tr.hl td{background:var(--accent-soft)}
.coinrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.coinrow:last-child{border-bottom:0}
.coinrow img,.coinrow .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--sunk);border:1px solid var(--line)}
.coinrow .costin{width:96px;min-height:40px;padding:8px 10px;text-align:right}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
/* Bottom bar */
.pbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:5}
.pbar button{width:100%;max-width:460px;margin:0 auto;display:flex;justify-content:space-between;background:var(--ink);color:var(--bg);min-height:54px}
.toast{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:600}
.home-hero{padding-top:28px;display:flex;flex-direction:column;gap:10px}
.coinmark{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-soft),var(--accent));box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--accent) 70%,transparent)}
.slider{width:100%;accent-color:var(--accent)}
.feas{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.feas.good{background:var(--good-soft)} .feas.warn{background:var(--warn-soft)} .feas.bad{background:var(--bad-soft)} .feas.neutral{background:var(--sunk)}
.rare{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.rare.strong{background:var(--accent);color:#fff;border-color:var(--accent)}
.rare b{font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;min-height:44px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sheet{border:1.5px solid var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.confirmbox{border:1px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

<body>
<div id="app" aria-live="polite"></div>
<div id="pbar" class="pbar" hidden></div>

<script>
// Coin Scanner pricing engine.
// Pure functions only: no network, no DOM. The same file moves into the
// Next.js app unchanged; only the data feeding it changes (sample -> live APIs).
//
// Definitions used everywhere:
//   margin  = profit / sell price   (a 25% margin on a $100 sale = $25 profit)
//   markup is never used, to avoid confusion.

const GRADES = ['VG', 'F', 'VF', 'XF', 'AU', 'UNC'];
const TODAY = new Date('2026-10-05T12:00:00');

const round2 = (n) => Math.round(n * 100) / 100;
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

function percentile(values, p) {
  const s = [...values].sort((a, b) => a - b);
  if (!s.length) return null;
  const i = (s.length - 1) * p;
  const lo = Math.floor(i), hi = Math.ceil(i);
  return s[lo] + (s[hi] - s[lo]) * (i - lo);
}

function median(values) { return percentile(values, 0.5); }

// Melt from actual silver/gold weight (troy oz) and spot ($/oz).
function melt(coin, spot) {
  return round2((coin.asw || 0) * spot.silver + (coin.agw || 0) * spot.gold);
}

// Grades that apply: bullion-type coins price as "ANY" grade.
function gradeKeys(coin, grades) {
  return coin.skipGrade ? ['ANY'] : grades;
}

function salesFor(coin, grades) {
  const keys = gradeKeys(coin, grades);
  return coin.sales.filter((s) => keys.includes(s.grade));
}

// Market range for ONE grade.
//   3+ sales at that grade -> middle half of those sales (25th-75th pct)
//   1-2 sales             -> span of those sales and CPG
//   0 sales, CPG only     -> 85%-100% of CPG (CPG is a retail guide)
//   nothing               -> null ("not enough data")
// Never below melt.
function marketForGrade(coin, grade, spot) {
  const m = melt(coin, spot);
  const prices = coin.sales.filter((s) => s.grade === grade).map((s) => s.price);
  const cpg = coin.cpg ? coin.cpg[grade] : undefined;
  let low, high, basis;
  if (prices.length >= 3) {
    low = percentile(prices, 0.25);
    high = percentile(prices, 0.75);
    basis = `${prices.length} recent sales`;
  } else if (prices.length >= 1 && cpg) {
    const all = [...prices, cpg];
    low = Math.min(...all);
    high = Math.max(...all);
    basis = `${prices.length} sale${prices.length > 1 ? 's' : ''} + CPG`;
  } else if (prices.length >= 1) {
    low = Math.min(...prices);
    high = Math.max(...prices);
    basis = `${prices.length} sale${prices.length > 1 ? 's' : ''} only`;
  } else if (cpg) {
    low = cpg * 0.85;
    high = cpg;
    basis = 'CPG only (retail guide)';
  } else {
    return null;
  }
  return {
    low: round2(Math.max(low, m)),
    high: round2(Math.max(high, m)),
    basis,
    meltFloor: low < m,
  };
}

// Market range across one or more grades (an unconfirmed grade range).
function marketRange(coin, grades, spot) {
  const keys = gradeKeys(coin, grades);
  const parts = keys.map((g) => marketForGrade(coin, g, spot)).filter(Boolean);
  if (!parts.length) return null;
  const low = Math.min(...parts.map((p) => p.low));
  const high = Math.max(...parts.map((p) => p.high));
  return {
    low, high,
    mid: round2((low + high) / 2),
    basis: parts.length > 1 && parts.every((p) => /recent sales$/.test(p.basis))
      ? `${coin.sales.filter((s) => keys.includes(s.grade)).length} recent sales across ${keys[0]}–${keys[keys.length - 1]}`
      : parts.map((p) => p.basis).join(' · '),
    grades: keys,
  };
}

// Target buy: confirmed grade -> midpoint; unconfirmed -> low end (never overpay
// while the grade is still a range).
function targetBuy(range, margin, gradeConfirmed) {
  if (!range) return null;
  const base = gradeConfirmed ? range.mid : range.low;
  return round2(base * (1 - margin));
}

// Liquidity meter, 0-100. Four visible factors so the dealer sees WHY.
function liquidity(coin, spot, range) {
  const m = melt(coin, spot);
  const yearAgo = new Date(TODAY); yearAgo.setFullYear(yearAgo.getFullYear() - 1);
  const recent = coin.sales.filter((s) => new Date(s.date) >= yearAgo);
  const n = recent.length;
  const mid = range ? range.mid : m;

  const velocity = clamp(Math.log(1 + n) / Math.log(1 + 12), 0, 1); // 12+ sales/yr = full
  const meltShare = mid > 0 ? clamp(m / mid, 0, 1) : 0;              // anyone buys metal
  const priceBand = mid <= 100 ? 1 : mid <= 500 ? 0.8 : mid <= 2000 ? 0.55 : 0.35;
  let consistency = 0.4;                                              // unknown -> neutral-low
  const prices = recent.map((s) => s.price);
  if (prices.length >= 3) {
    const mean = prices.reduce((a, b) => a + b, 0) / prices.length;
    const sd = Math.sqrt(prices.reduce((a, b) => a + (b - mean) ** 2, 0) / prices.length);
    consistency = clamp(1 - (sd / mean) / 0.5, 0, 1);
  }

  const factors = [
    { key: 'velocity', label: 'Sales activity', value: velocity, weight: 0.4,
      note: `${n} sale${n === 1 ? '' : 's'} in the last 12 months` },
    { key: 'meltShare', label: 'Metal backing', value: meltShare, weight: 0.25,
      note: `Melt is ${Math.round(meltShare * 100)}% of value` },
    { key: 'consistency', label: 'Price consistency', value: consistency, weight: 0.2,
      note: prices.length >= 3 ? 'Spread of recent sale prices' : 'Too few sales to measure' },
    { key: 'priceBand', label: 'Buyer pool', value: priceBand, weight: 0.15,
      note: mid <= 100 ? 'Under $100: many buyers' : mid <= 500 ? '$100–500' : mid <= 2000 ? '$500–2,000' : 'Over $2,000: fewer buyers' },
  ];
  const score = Math.round(factors.reduce((a, f) => a + f.value * f.weight, 0) * 100);
  const label = score >= 70 ? 'Fast' : score >= 45 ? 'Moderate' : 'Slow';
  const confidence = n >= 6 ? 'High' : n >= 3 ? 'Medium' : 'Low';
  return { score, label, factors, confidence, salesCount: n };
}

// Margin feasibility: can this cost + target margin actually be sold for?
// requiredSell = cost / (1 - margin)
function feasibility(coin, grades, cost, margin, spot) {
  if (!(cost > 0)) return null;
  const requiredSell = round2(cost / (1 - margin));
  const prices = salesFor(coin, grades).map((s) => s.price);
  if (prices.length >= 3) {
    const hits = prices.filter((p) => p >= requiredSell).length;
    const share = hits / prices.length;
    const med = median(prices);
    return {
      requiredSell, basis: 'sales', hits, total: prices.length, share,
      status: share >= 0.6 ? 'Likely' : share >= 0.3 ? 'Possible' : 'Unlikely',
      marginAtMedian: round2((med - cost) / med),
      medianSale: round2(med),
    };
  }
  const keys = gradeKeys(coin, grades);
  const cpgs = keys.map((g) => coin.cpg && coin.cpg[g]).filter(Boolean);
  if (cpgs.length) {
    const cpg = Math.max(...cpgs);
    return {
      requiredSell, basis: 'cpg', cpg,
      status: requiredSell <= cpg * 0.85 ? 'Likely' : requiredSell <= cpg ? 'Possible' : 'Unlikely',
      marginAtMedian: null,
    };
  }
  return { requiredSell, basis: 'none', status: 'Unknown' };
}

// Highest margin the market supports at this cost (using the median sale).
function maxMarginAt(range, cost) {
  if (!range || !(cost > 0)) return null;
  return round2((range.mid - cost) / range.mid);
}

// Purchase / bulk-buy totals.
//   items: [{ cost, low, high, mid, melt, liquidity, sellBasis }]
//   lotOffer: optional single offer for the whole lot (overrides per-coin costs,
//             allocated across coins by expected sale value)
function purchaseTotals(items, margin, lotOffer) {
  const sum = (k) => round2(items.reduce((a, it) => a + (it[k] || 0), 0));
  const low = sum('low'), high = sum('high'), mid = sum('mid'), meltTotal = sum('melt');
  const costEntered = sum('cost');
  const cost = lotOffer > 0 ? lotOffer : costEntered;
  const maxOffer = round2(items.reduce((a, it) => a + it.targetBase * (1 - margin), 0));
  const profitMid = round2(mid - cost);
  const profitLow = round2(low - cost);
  const profitHigh = round2(high - cost);
  const marginMid = mid > 0 ? round2(profitMid / mid) : 0;
  const requiredSell = round2(cost / (1 - margin));
  const status = !(cost > 0) ? 'Unknown'
    : requiredSell <= low ? 'Likely'
    : requiredSell <= high ? 'Possible' : 'Unlikely';
  const scored = items.filter((it) => it.liquidity != null && it.mid > 0);
  const scoredMid = scored.reduce((a, it) => a + it.mid, 0);
  const liq = scored.length
    ? Math.round(scored.reduce((a, it) => a + it.liquidity * it.mid, 0) / scoredMid)
    : null;
  const allocated = items.map((it) => ({
    ...it,
    allocCost: lotOffer > 0 && mid > 0 ? round2(lotOffer * (it.mid / mid)) : it.cost,
  }));
  return { count: items.length, low, high, mid, meltTotal, cost, costEntered, maxOffer,
    profitMid, profitLow, profitHigh, marginMid, requiredSell, status, liquidity: liq, allocated };
}


// SAMPLE DATA ONLY. Prices and sales are invented placeholders for the prototype.
// Specs (weight, fineness, ASW/AGW) are approximate. Live data replaces all of this
// once Numista, metals.dev and Greysheet keys are connected.

const SAMPLE_SPOT = { silver: 75.5, gold: 4790, asOf: 'Sample spot' };

const SAMPLE_COINS = [
  {
    id: 'mx-peso-1918',
    name: '1918 Mexico 1 Peso',
    country: 'Mexico', denomination: '1 Peso', year: '1918', mint: 'Mexico City (Mo)',
    composition: 'Silver', fineness: '.800', weight: '18.13 g', diameter: '33 mm',
    asw: 0.4663, mintage: '3,050,000', numista: 'N# sample-1', km: 'KM# 454',
    category: 'World silver', uncertain: ['mint'],
    suggestedGrades: ['VF', 'XF'], gradeSensitive: false, skipGrade: false,
    cpg: { VG: 38, F: 45, VF: 60, XF: 95, AU: 160, UNC: 300 },
    sales: [
      { date: '2026-09-21', grade: 'XF', price: 102 }, { date: '2026-09-02', grade: 'XF', price: 95 },
      { date: '2026-08-14', grade: 'VF', price: 58 }, { date: '2026-07-30', grade: 'XF', price: 108 },
      { date: '2026-07-02', grade: 'XF', price: 91 }, { date: '2026-05-19', grade: 'VF', price: 63 },
      { date: '2026-04-11', grade: 'AU', price: 151 }, { date: '2026-02-27', grade: 'XF', price: 88 },
      { date: '2025-12-09', grade: 'VF', price: 61 },
    ],
    alternates: ['1919 Mexico 1 Peso', '1918 Mexico 50 Centavos'],
  },
  {
    id: 'us-morgan-1921s',
    name: '1921-S Morgan Dollar',
    country: 'United States', denomination: '1 Dollar', year: '1921', mint: 'San Francisco (S)',
    composition: 'Silver', fineness: '.900', weight: '26.73 g', diameter: '38.1 mm',
    asw: 0.7734, mintage: '21,695,000', numista: 'N# sample-2', km: 'KM# 110',
    category: 'US silver dollar', uncertain: ['mint'],

function newLot(name) {

  S.lots.unshift(lot); S.purchase = lot; save(); return lot;
}
// One-coin deals go here instead of needing a whole lot.
function singlesLot() {
  let l = S.lots.find((x) => x.kind === 'singles');
  if (!l) { l = { id: 'singles', kind: 'singles', name: 'Single buys', notes: '', status: 'bought', asking: '', items: [], lotOffer: '', lotMargin: null, updated: Date.now() }; S.lots.push(l); }
  return l;
}

const realLots = () => S.lots.filter((l) => l.kind !== 'singles').sort((a, b) => (b.updated || 0) - (a.updated || 0));

  if (S.coin.source === 'ai') { item.coin = S.coin; item.expSale = S.expSale; }
  return item;
}
const RARITY = { key: 'Key date', 'semi-key': 'Semi-key date', variety: 'Check for a variety', scarce: 'Scarce issue', lowmintage: 'Low mintage' };
function rarityOf(c) {
  if (!c) return null;
  if (c.rarity && RARITY[c.rarity.level]) return c.rarity;
  const n = parseInt(String(c.mintage || '').replace(/[^0-9]/g, ''), 10);
  if (!c.skipGrade && n > 0 && n < 50000) return { level: 'lowmintage', note: `Only ${n.toLocaleString('en-US')} minted.`, check: '' };
  return null;
}
function rarityBanner(c) {
  const r = rarityOf(c); if (!r) return '';
  const strong = r.level === 'key' || r.level === 'semi-key';
  return `<div class="rare ${strong ? 'strong' : ''}" role="note"><div class="row between"><b>${strong ? '🔑 ' : '⚑ '}${RARITY[r.level]}</b><span class="small">Don't sell it short</span></div>
    ${r.note ? `<span class="small">${esc(r.note)}</span>` : ''}${r.check ? `<span class="small"><b>Check:</b> ${esc(r.check)}</span>` : ''}</div>`;
}

function recordHistory() {

/* ---------- derived values for one coin ---------- */
// AI-identified coins have no market data yet: value comes from the dealer's
// expected sale price, or else Claude's rough estimate (clearly labeled).
function aiRange(coin, g, expSale) {
  const m = melt(coin, spot());
  const exp = parseFloat(expSale);
  if (exp > 0) return { low: exp, high: exp, mid: exp, basis: 'your expected sale price', grades: g, source: 'dealer' };
  const cpg = g.map((k) => coin.cpg && coin.cpg[k]).filter((v) => v > 0);
  if (cpg.length) {
    const lo = Math.max(Math.min(...cpg) * 0.85, m), hi = Math.max(Math.max(...cpg), m);
    const belowMelt = Math.max(...cpg) < m;
    return { low: lo, high: hi, mid: Math.round((lo + hi) / 2 * 100) / 100, basis: belowMelt ? 'melt value (CPG retail is below melt)' : 'CPG retail (85–100%), via CDN', grades: g, source: 'cpg' };
  }
  const nv = g.map((k) => coin.numistaVal && coin.numistaVal[k]).filter((v) => v > 0);
  if (nv.length) {
    const lows = g.map((k) => coin.numistaLow && coin.numistaLow[k]).filter((v) => v > 0 && v < Infinity);
    const lo = Math.max(Math.min(...(lows.length ? lows : nv)), m), hi = Math.max(Math.max(...nv), m);
    return { low: lo, high: hi, mid: Math.round((lo + hi) / 2 * 100) / 100, basis: coin.varieties ? 'Numista price estimates, covering all varieties of this year' : 'Numista price estimates', grades: g, source: 'numista' };
  }
  const parts = g.map((k) => coin.aiValue && coin.aiValue[k]).filter((v) => Array.isArray(v) && v.length === 2 && v[1] > 0);
  if (!parts.length) return null;
  const low = Math.max(Math.min(...parts.map((p) => +p[0])), m);
  const high = Math.max(Math.max(...parts.map((p) => +p[1])), m);
  return { low, high, mid: Math.round((low + high) / 2 * 100) / 100, basis: 'Claude\'s rough estimate, not market data', grades: g, source: 'ai' };
}

function analyze(coin, grades, confirmed, costInput, marginOverride, expSale) {
  const m = marginOverride ?? marginFor(coin);
  const g = coin.skipGrade ? ['ANY'] : grades;
  const isConfirmed = coin.skipGrade || confirmed;
  const isAI = coin.source === 'ai';
  const isQuick = coin.source === 'quick';
  let range = isQuick ? null : isAI ? aiRange(coin, g, expSale) : marketRange(coin, g, spot());
  if (isQuick) { const mv = melt(coin, spot()); range = { low: mv, high: mv, mid: mv, basis: 'melt', grades: g, source: 'melt' }; }
  const limited = isAI && (!range || range.source === 'ai');
  // AI-only estimate: always price the target buy from the LOW end (conservative), labeled as an estimate.
  const tbRaw = limited ? (range ? round2(range.low * (1 - m)) : null) : targetBuy(range, m, isConfirmed);
  const feeBase = range ? (isConfirmed && !limited ? range.mid : range.low) : 0;
  const tb = tbRaw == null ? null : Math.max(0, round2(tbRaw - feeOf(feeBase)));
  const hideTarget = coin.gradeSensitive && !isConfirmed;
  const cost = parseFloat(costInput);
  const effCost = cost > 0 ? cost : tb;
  const liq = isAI || isQuick ? null : liquidity(coin, spot(), range);
  const fp = feeOn() ? (+S.settings.fee.pct || 0) / 100 : 0, ff = feeOn() ? (+S.settings.fee.fixed || 0) : 0;
  const feas = effCost > 0 && (!isAI || (range && range.source === 'cpg')) ? feasibility(coin, g, effCost + ff, Math.min(0.95, m + fp), spot()) : null;
  return {
    isAI, limited, margin: m, grades: g, confirmed: isConfirmed, range, targetBuy: tb, hideTarget, liq, feas,
    melt: melt(coin, spot()), cost: cost > 0 ? cost : null, effCost,
    profitLow: range && effCost ? range.low - feeOf(range.low) - effCost : null,
    profitHigh: range && effCost ? range.high - feeOf(range.high) - effCost : null,
    maxMargin: range && effCost ? round2((range.mid - feeOf(range.mid) - effCost) / range.mid) : null,
    targetBase: feeBase,
    cpg: g.map((k) => coin.cpg && coin.cpg[k]).filter(Boolean),
  };
}

  <h2>Which sample coin?</h2>
  <div class="list">${SAMPLE_COINS.map((c) => `<button data-a="pickCoin" data-id="${c.id}"><span>${esc(c.name)}</span><span class="small muted">${esc(c.category)}</span></button>`).join('')}</div>`;

screens.fields = () => {
  const f = S.fields, c = S.coin;
  const field = (k, label) => {
    const unsure = c.uncertain.includes(k);
    return `<label class="field" for="f-${k}">${label}${unsure ? ' <span class="flag">Check this</span>' : ''}
      <input id="f-${k}" type="text" data-field="${k}" value="${esc(f[k])}" class="${unsure ? 'uncertain' : ''}"></label>`;
  };
  return `
  <div class="topbar"><button class="back" data-a="scan">Retake photos</button></div>
  <div class="thumbs">${['obv', 'rev'].map((s) => S.photos[s] ? `<img src="${S.photos[s]}" alt="">` : `<div class="ph">${s === 'obv' ? 'Front' : 'Back'}</div>`).join('')}</div>
  <h2>Here's what we read</h2>
  <div class="stack">${field('country', 'Country')}${field('denomination', 'Denomination')}${field('year', 'Year')}${field('mint', 'Mint mark')}</div>
  <p class="small muted">Fix anything that's wrong. Corrections rerun the search and are saved to improve identification.</p>
  ${c.source === 'ai' || S.manual
    ? `<button class="btn-primary btn-wide" data-a="toMatch">Looks right, continue</button>
       <button class="btn-ghost btn-wide" data-a="researchId">Search again with my edits</button>`
    : `<button class="btn-primary btn-wide" data-a="toMatch">Looks right, continue</button>`}`;
};


screens.match = () => {
  const c = S.coin;
  if (c.source === 'ai') return aiMatch(c);
  const edited = Object.keys(S.fields).some((k) => S.fields[k] !== c[k]);
  const conf = edited || c.uncertain.length > 1 ? 'Medium' : 'High';
  if (S.candidates) {
    return `
    <div class="topbar"><button class="back" data-a="hideCandidates">Back</button></div>
    <h2>Which coin is yours?</h2>
    <div class="list">
      <button data-a="confirmMatch"><span>${esc(c.name)}</span><span class="small muted">${esc(c.numista)}</span></button>
      ${c.alternates.map((a) => `<button disabled><span>${esc(a)}</span><span class="small muted">Sample only</span></button>`).join('')}
    </div>
    <button class="btn-ghost btn-wide" data-a="go" data-s="fields">Edit details and search again</button>`;
  }
  return `
  <div class="topbar"><button class="back" data-a="go" data-s="fields">Edit details</button><span class="pill ${conf === 'High' ? 'good' : 'warn'}">${conf} confidence</span></div>
  <p class="eyebrow">Match found</p>
  <h2>${esc(c.name)}</h2>
  <div class="grid2">
    <div class="tile"><span class="eyebrow">Your photos</span><div class="thumbs">${['obv', 'rev'].map((s) => S.photos[s] ? `<img src="${S.photos[s]}" alt="" style="width:56px;height:56px">` : `<div class="ph" style="width:56px;height:56px">—</div>`).join('')}</div></div>
    <div class="tile"><span class="eyebrow">Reference</span><span class="small muted">Numista images appear here once connected</span></div>
  </div>
  <p class="small muted">${esc(c.numista)} · ${esc(c.km)} · Source: Numista</p>
  <button class="btn-primary btn-wide" data-a="confirmMatch">Yes, this is it</button>
  <button class="btn-ghost btn-wide" data-a="showCandidates">Not my coin</button>`;
};

function aiMatch(c) {
  const conf = c.confidence || 'Medium';
  const photos = `<div class="thumbs">${['obv', 'rev'].map((s) => S.photos[s] ? `<img src="${S.photos[s]}" alt="" style="width:72px;height:72px">` : '').join('')}</div>`;
  if (S.candidates) {
    return `
    <div class="topbar"><button class="back" data-a="hideCandidates">Back</button></div>
    <h2>Which coin is yours?</h2>
    <p class="small muted">Tap one and Claude re-checks your photos against it.</p>
    <div class="list">
      ${(c.alternates || []).map((a, i) => `<button data-a="pickCandidate" data-i="${i}"><span style="min-width:0"><b>${esc(a.coin_name || a)}</b><br><span class="small muted">${esc(a.why || '')}</span></span><span aria-hidden="true">›</span></button>`).join('') || '<p class="muted">No other likely matches.</p>'}
    </div>
    <button class="btn-ghost btn-wide" data-a="go" data-s="fields">Edit details and search again</button>
    <button class="btn-ghost btn-wide" data-a="scan">Try new photos</button>`;
  }
  return `
  <div class="topbar"><button class="back" data-a="go" data-s="fields">Edit details</button><span class="pill ${tone(conf === 'High' ? 'Likely' : conf === 'Medium' ? 'Possible' : 'Unlikely')}">${esc(conf)} confidence</span></div>
  <p class="eyebrow">Match found${S.idSeconds ? ` · ${S.idSeconds}s` : ''}</p>
  <h2>${esc(c.name)}</h2>
  ${rarityBanner(c)}
  ${photos}
  ${c.numistaUrl ? `<p class="small muted">Numista match: ${esc(c.numistaTitle || '')}</p>` + `<a class="btn btn-ghost btn-wide" href="${esc(c.numistaUrl)}" target="_blank" rel="noopener">Compare with Numista photos · ${esc(c.numista)} ›</a>` : c.lookupPending ? '<p class="small muted">Checking Numista…</p>' : ''}
  ${c.slab ? `<div class="tile"><span class="eyebrow">${esc(c.slab.service || 'Slab')} slab detected</span><b>${esc(c.slab.grade || 'Grade not read')}</b>${c.slab.cert ? `<span class="small muted num">Cert # ${esc(c.slab.cert)}</span>` : ''}
    ${c.slab.service && /pcgs/i.test(c.slab.service) ? `<a class="small" href="https://www.pcgs.com/cert/${encodeURIComponent(c.slab.cert || '')}" target="_blank" rel="noopener" style="color:var(--accent)">Verify on PCGS</a>` : c.slab.service && /ngc/i.test(c.slab.service) ? `<a class="small" href="https://www.ngccoin.com/certlookup/" target="_blank" rel="noopener" style="color:var(--accent)">Verify on NGC</a>` : ''}</div>` : ''}
  ${c.varieties ? `<p class="small"><span class="flag">Variety:</span> Numista lists ${c.varieties.length} varieties for this year (${c.varieties.map(esc).join(' / ')}). Prices cover all of them until you confirm which.</p>` : ''}
  ${c.uncertain.length ? `<p class="small"><span class="flag">Check:</span> ${c.uncertain.map(esc).join(', ')}</p>` : ''}
  ${c.photoFeedback ? `<p class="small muted">${esc(c.photoFeedback)}</p>` : ''}
  <p class="small muted">Read by Claude from your photos.${c.numistaUrl ? ' Coin data from Numista.' : ''}</p>
  <button class="btn-primary btn-wide" data-a="confirmMatch">Yes, this is it</button>
  <button class="btn-ghost btn-wide" data-a="showCandidates">Not my coin</button>`;
}

screens.grade = () => {
  const c = S.coin;
  const sugg = c.suggestedGrades && c.suggestedGrades.length ? c.suggestedGrades : ['F', 'VF'];
  return `
  <div class="topbar"><button class="back" data-a="go" data-s="match">Back</button></div>
  <p class="eyebrow">${esc(c.name)}</p>
  <h2>What grade?</h2>
  <p class="muted">Suggested from your photos: <b>${sugg[0]}${sugg.length > 1 ? '–' + sugg[sugg.length - 1] : ''}</b>. Tap the grade you see.</p>
  ${c.gradeNote ? `<p class="small muted">${esc(c.gradeNote)}</p>` : ''}
  <div class="chips">${GRADES.map((g) => `<button class="chip ${sugg.includes(g) ? 'sugg' : ''}" data-a="setGrade" data-g="${g}">${g}</button>`).join('')}</div>
  ${c.gradeSensitive ? `<div class="banner">Grade changes this coin's value a lot. Confirm a grade to see a target buy.</div>` : ''}
  <button class="btn-ghost btn-wide" data-a="useRange">Use suggested range for now</button>`;
};

function liquidityBlock(liq, title = 'Liquidity') {
  return `
  <div class="card">
    <div class="row between"><span class="eyebrow">${title} · beta</span><span class="pill ${tone(liq.label)}">${liq.label} · ${liq.score}</span></div>
    <div class="meter" role="img" aria-label="Liquidity ${liq.score} of 100"><i style="left:${liq.score}%"></i></div>
    ${liq.factors ? `<details><summary>Why ${liq.label.toLowerCase()}?</summary><div class="stack">
      ${liq.factors.map((f) => `<div class="factor"><span>${f.label}</span><span class="muted">${f.note}</span><div class="bar"><span style="width:${Math.round(f.value * 100)}%"></span></div></div>`).join('')}
      <p class="small muted">Data confidence: ${liq.confidence}. Gets sharper as live sales data and your own sell-through history come in.</p>
    </div></details>` : ''}
  </div>`;
}

function feasBlock(a, coin) {
  const f = a.feas;
  if (!f) return '';
  let body;
  if (f.basis === 'sales') {
    body = `<b>${f.hits} of ${f.total}</b> recent sales ${a.grades.length > 1 ? 'in this grade range' : coin.skipGrade ? '' : 'at this grade'} were ${money(f.requiredSell)} or more.`;
  } else if (f.basis === 'cpg') {
    body = `Not enough sales yet. Compared with CPG retail of ${money(f.cpg)}.`;
  } else body = 'No sales or CPG data to check against.';
  return `<div class="feas ${tone(f.status)}">
    <div class="row between"><b>Your ${pct(a.margin)} margin</b><span class="pill ${tone(f.status)}">${f.status}</span></div>
    <span class="small">To make ${pct(a.margin)} at ${money(a.effCost)}, you need to sell for <b>${money(f.requiredSell)}</b>. ${body}</span>
    ${a.maxMargin != null ? `<span class="small">At a typical sale (${money(a.range.mid)}), this cost gives a <b>${pct(a.maxMargin)}</b> margin.</span>` : ''}
  </div>`;
}

// One line answering "what is it / what's in it".
function identityLine(c) {
  const parts = [];
  if (c.km) parts.push(c.km);
  const comp = String(c.composition || '').replace(/\s*\(.*\)\s*/, ' ').trim();
  if (c.fineness && comp) parts.push(`${c.fineness} ${comp.toLowerCase()}`); else if (comp) parts.push(comp);
  if (c.asw) parts.push(`${(+c.asw).toFixed(4)} oz silver`);
  if (c.agw) parts.push(`${(+c.agw).toFixed(4)} oz gold`);
  return parts.join(' · ');
}

screens.money = () => {
  const c = S.coin;
  const a = analyze(c, S.grades, S.confirmed, S.cost, null, S.expSale);
  const gradeTxt = gradeLabel(c, a.grades);
  const idl = identityLine(c);
  recordHistory();
  const profitTxt = a.targetBuy && a.range ? (() => {
    const lo = a.range.low - feeOf(a.range.low) - a.targetBuy, hi = a.range.high - feeOf(a.range.high) - a.targetBuy;
    const w = (n) => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US'); const L = w(lo), H = w(hi); return L === H ? `~${H}` : `~${L}–${H}`;
  })() : null;
  return `
  <div class="topbar"><button class="back" data-a="go" data-s="${c.skipGrade ? 'match' : 'grade'}">Back</button>
    ${c.skipGrade ? '<span class="pill neutral">Bullion pricing</span>' : `<button class="btn-link" data-a="go" data-s="grade">${a.confirmed ? `${gradeTxt} · Change` : `${gradeTxt} suggested · Confirm`}</button>`}</div>
  <div class="stack" style="gap:4px">
    <h2>${esc(c.name)}</h2>
    ${idl ? `<span class="small muted">${esc(idl)}</span>` : ''}
    ${c.lookupPending ? '<span class="small muted">Checking Numista and Greysheet…</span>' : ''}
  </div>
  ${rarityBanner(c)}

  ${c.gsVarieties ? `<div class="card"><span class="eyebrow">Which variety?</span>
    <div class="list">${c.gsVarieties.map((v, i) => `<button data-a="pickVariety" data-i="${i}" style="${c.gsVariety === i ? 'border-color:var(--accent);background:var(--accent-soft)' : ''}"><span>${esc(v.name)}</span><span class="small muted">${c.gsVariety === i ? 'Selected' : ''}</span></button>`).join('')}</div>
    <span class="small muted">${c.gsVariety == null ? 'Prices cover all varieties until you pick one.' : 'Prices are for this variety.'}</span></div>` : ''}

  ${a.limited ? `
  <div class="card">
    <div class="row between"><span class="eyebrow">Market</span><span class="pill warn">AI estimate</span></div>
    <span class="big" style="color:var(--warn)">${a.range ? range$(a.range) : '—'}</span>
    <span class="small muted">No CPG or Numista price for this coin, so this is Claude's estimate, not sales data. Check sales before paying well over melt.</span>
    <label class="field" for="expsale">Know what it sells for? (optional)
      <input id="expsale" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Your expected sale price" value="${esc(S.expSale)}"></label>
  </div>` : `
  <div class="card">
    <span class="eyebrow">Market</span>
    <span class="big">${a.range ? range$(a.range) : '—'}</span>
    <span class="small muted">${a.range ? `Based on ${esc(a.range.basis)}${!a.confirmed ? ' · narrows when you confirm the grade' : ''}` : ''}</span>
    ${a.range && a.range.source === 'dealer' ? `<label class="field" for="expsale">Expected sale price
      <input id="expsale" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(S.expSale)}"></label>` : ''}
  </div>`}

  <div class="card">
    <span class="eyebrow">Target buy</span>
    ${a.hideTarget
      ? `<span class="mid">Confirm grade</span><button class="btn-ghost" data-a="go" data-s="grade">Pick the grade</button>`
      : a.targetBuy == null
        ? `<span class="mid">—</span><span class="small muted">Enter an expected sale price to get a target buy.</span>`
        : `<span class="big"${a.limited ? ' style="color:var(--warn)"' : ''}>${a.limited ? '~' : ''}${money(a.targetBuy)}</span>
           <span class="small muted">${pct(a.margin)} margin${feeOn() ? ' ' + feeNote() : ''}${a.limited ? ', from the low end of the AI estimate' : a.confirmed ? '' : ', from the low end until grade is confirmed'}${profitTxt ? ` · expected profit ${profitTxt}` : ''} · <button class="btn-link small" data-a="go" data-s="settings" style="padding:0">Change</button></span>`}
  </div>

  <div class="grid3">
    <div class="tile"><span class="eyebrow">Melt</span>${a.melt > 0 ? `<b class="num">${money(a.melt)}</b>` : '<span class="small muted">No silver or gold</span>'}</div>
    ${a.isAI
      ? `<div class="tile"><span class="eyebrow">CPG</span>${a.cpg.length ? `<b class="num">${a.cpg.map(money).join('–')}</b><a class="small" href="https://www.greysheet.com" target="_blank" rel="noopener" style="color:var(--accent)">via CDN</a>` : `<span class="small muted">${c.lookupPending ? 'Loading…' : c.gsMismatch ? 'No exact match' : 'Not found'}</span>`}</div>`
      : `<div class="tile"><span class="eyebrow">CPG</span><b class="num">${a.cpg.length ? a.cpg.map(money).join('–') : '—'}</b>
      <a class="small" href="https://www.greysheet.com" target="_blank" rel="noopener" style="color:var(--accent)">via CDN</a></div>`}
    <button class="tile" data-a="go" data-s="sales" style="border:0;min-height:0;font-weight:400;color:var(--ink);text-align:left;justify-content:flex-start;align-items:stretch"><span class="eyebrow">Sales ›</span><b class="num">${a.isAI ? '<span class="small">eBay · PCGS</span>' : salesRange(c, a.grades)}</b></button>
  </div>

  ${actionArea(a)}

  <details id="more" ${S.moreOpen ? 'open' : ''}><summary>More analysis ›</summary>
    <div class="stack" style="margin-top:8px">
      ${greyLine(c, a)}
      <div class="card" id="calc">${calcInner(c, a)}</div>
      ${a.liq ? liquidityBlock(a.liq) : ''}
    </div>
  </details>

  <div class="row between">
    <button class="btn-link" data-a="go" data-s="details">Coin details ›</button>
    <button class="btn-link" data-a="go" data-s="sales">Sales ›</button>
  </div>
  <p class="small muted" style="text-align:center">${S.feedback ? 'Thanks, noted.' : `Correct ID? <button class="btn-link small" data-a="fb" data-v="yes">Yes</button> · <button class="btn-link small" data-a="fb" data-v="no">No</button>`}</p>`;
};

// What the dealer can do with this coin. Nothing is pre-assigned to a lot.
function actionArea(a) {
  const defPrice = a.cost ?? a.targetBuy ?? null;
  const priceField = (label) => `<label class="field" for="paid">${label}
      <input id="paid" type="number" inputmode="decimal" min="0" step="0.01" placeholder="${defPrice != null ? 'Target buy ' + money(defPrice) : 'Price'}" value="${esc(S.paid ?? (defPrice != null ? defPrice : ''))}"></label>`;
  if (S.added) {
    const L = S.lots.find((l) => l.id === S.added.lot);
    const bought = S.added.kind === 'bought';
    return `<div class="toast">✓ ${bought ? `Bought for ${money(S.added.cost)} · in Single buys` : `Saved to ${esc(L ? L.name : 'lot')} as ${S.added.status === 'maybe' ? 'Maybe' : 'Buy'}`}</div>
      ${bought ? '<button class="btn-primary btn-wide" data-a="listing">Create listing</button>' : ''}
      <div class="grid2"><button class="${bought ? 'btn-ghost' : 'btn-primary'}" data-a="scan">Scan next coin</button><button class="btn-ghost" data-a="openLot" data-id="${esc(S.added.lot)}">${bought ? 'Single buys ›' : 'View lot ›'}</button></div>`;
  }
  if (S.sheet === 'bought') return `<div class="sheet">
      <b>Bought it</b>
      ${priceField('What did you pay?')}
      <button class="btn-primary btn-wide" data-a="saveBought">Save purchase</button>
      <div class="row between"><button class="btn-link small" data-a="sheet" data-v="">Cancel</button><button class="btn-link small" data-a="sheet" data-v="lot">Part of a bigger deal? Use a lot ›</button></div>
    </div>`;
  if (S.sheet === 'lot') {
    const lots = realLots().slice(0, 5);
    const st = S.lotStatus || 'buy';
    return `<div class="sheet">
      <b>Save to a lot</b>
      <div class="seg" role="group" aria-label="Buy or maybe">
        <button class="${st === 'buy' ? 'on' : ''}" data-a="lotPick" data-v="buy">Buy</button>
        <button class="${st === 'maybe' ? 'on' : ''}" data-a="lotPick" data-v="maybe">Maybe</button>
      </div>
      <span class="small muted">${st === 'buy' ? 'Counts toward the lot total.' : 'Saved in the lot but not counted. Switch it to Buy anytime.'}</span>
      ${priceField('Your price for this coin')}
      ${lots.length ? `<span class="eyebrow">Existing lots</span><div class="list">${lots.map((l) => `<button data-a="saveToLot" data-id="${esc(l.id)}"><span style="min-width:0"><b>${esc(l.name)}</b><br><span class="small muted">${l.items.length} coin${l.items.length === 1 ? '' : 's'}${l.notes ? ' · ' + esc(l.notes.slice(0, 30)) : ''}</span></span><span aria-hidden="true">+</span></button>`).join('')}</div>` : ''}
      <span class="eyebrow">${lots.length ? 'Or start a new lot' : 'New lot'}</span>
      <input id="newlot" type="text" placeholder="Table # or seller, e.g. Table 412 Mike" value="${esc(S.newLotName || '')}" aria-label="New lot name">
      <button class="btn-primary btn-wide" data-a="saveToLot" data-id="new">Create lot &amp; save</button>
      <button class="btn-link small" data-a="sheet" data-v="">Cancel</button>
    </div>`;
  }
  return `<div class="grid2">
      <button class="btn-primary" data-a="sheet" data-v="bought">Bought it</button>
      <button class="btn-ghost" data-a="sheet" data-v="lot">Save to a lot</button>
    </div>
    <button class="btn-ghost btn-wide" data-a="scan">Pass · scan next coin</button>
    <span class="small muted" style="text-align:center;margin-top:-6px">Every scan is kept in Recent scans either way.</span>`;
}

// Greysheet wholesale is internal-use only: shown only when the owner code is set on this phone.
function greyLine(c, a) {
  if (!c.grey || !store.get('cs.admin', '')) return '';
  const v = a.grades.map((k) => c.grey[k]).filter((x) => x > 0);
  if (!v.length) return '';
  return `<div class="tile"><span class="eyebrow">Greysheet wholesale · only you see this</span><b class="num">${v.map(money).join('–')}</b></div>`;
}

function salesRange(coin, grades) {
  const p = coin.sales.filter((s) => grades.includes(s.grade)).map((s) => s.price);
  if (!p.length) return 'None';
  const lo = Math.min(...p), hi = Math.max(...p);
  return lo === hi ? money(lo) : `${money(lo)}–${money(hi)}`;
}

function calcInner(c, a) {
  return `
    <label class="field" for="cost">What would you pay?
      <input id="cost" type="number" inputmode="decimal" min="0" step="0.01" placeholder="${a.targetBuy ? 'Target buy ' + money(a.targetBuy) : 'Your cost'}" value="${esc(S.cost)}"></label>
    ${a.effCost && a.range ? `<div class="grid2">
      <div class="tile"><span class="eyebrow">Expected profit</span><b class="num">${money(a.profitLow) === money(a.profitHigh) ? money(a.profitLow) : `${money(a.profitLow)}–${money(a.profitHigh)}`}</b></div>
      <div class="tile"><span class="eyebrow">Margin at typical sale</span><b class="num">${pct(a.maxMargin)}</b></div>
    </div>` : ''}
    ${feasBlock(a, c)}
    ${!a.cost && a.effCost ? '<span class="small muted">Showing numbers at your target buy. Enter a cost to test a real offer.</span>' : ''}`;
}

screens.sales = () => {
  const c = S.coin;
  const a = analyze(c, S.grades, S.confirmed, S.cost, null, S.expSale);
  const q = encodeURIComponent(c.name.replace(/\(.*\)/, '').trim());
  return `
  <div class="topbar"><button class="back" data-a="go" data-s="money">Back</button></div>
  <h2>Recent sales</h2>
  ${a.isAI ? `<div class="card"><p>Sales records for ${esc(c.name)} appear here once Numista is connected. Check sold prices now:</p></div>` : `
  <p class="small muted">${esc(c.name)} · highlighted rows match ${esc(gradeLabel(c, a.grades))}</p>
  <div class="card"><div class="tablewrap"><table>
    <thead><tr><th>Date</th><th>Grade</th><th class="r">Price</th></tr></thead>
    <tbody>${c.sales.map((s) => `<tr class="${a.grades.includes(s.grade) ? 'hl' : ''}"><td class="num">${s.date}</td><td>${s.grade === 'ANY' ? '—' : s.grade}</td><td class="r num">${money(s.price)}</td></tr>`).join('')}</tbody>
  </table></div>

}

// Display data for every item (Buy items carry their allocated cost from the totals).
function lotRows(P, T) {
  const alloc = Object.fromEntries(T.allocated.map((x) => [x.idx, x]));
  return P.items.map((raw, i) => {
    if (alloc[i]) return alloc[i];
    const coin = raw.quick ? quickCoin(raw.quick) : (raw.coin || coinById(raw.coinId));
    const a = analyze(coin, raw.grades || ['ANY'], raw.confirmed !== false, '', null, raw.expSale);
    return { coin, mid: a.range ? a.range.mid : 0, allocCost: raw.cost, gradeTxt: coin.source === 'quick' ? 'Melt-priced' : gradeLabel(coin, a.grades) };
  });
}

function lotTotals() {
  const P = S.purchase;
  const rows = P.items.map((it, idx) => ({ it, idx })).filter((x) => x.it.status !== 'maybe').map(({ it, idx }) => {
    const coin = it.quick ? quickCoin(it.quick) : (it.coin || coinById(it.coinId));
    const a = analyze(coin, it.grades || ['ANY'], it.confirmed !== false, '', null, it.expSale);
    return { ...it, idx, coin, a };
  });
  const defMargin = (() => {
    const tot = rows.reduce((s, r) => s + (r.a.range ? r.a.range.mid : 0), 0);
    if (!tot) return S.settings.marginNumis;
    return Math.round(rows.reduce((s, r) => s + marginFor(r.coin) * (r.a.range ? r.a.range.mid : 0), 0) / tot * 100) / 100;
  })();
  const margin = P.lotMargin ?? defMargin;
  const items = rows.map((r) => ({
    cost: r.cost, low: r.a.range ? r.a.range.low : 0, high: r.a.range ? r.a.range.high : 0,
    mid: r.a.range ? r.a.range.mid : 0, melt: r.a.melt, liquidity: r.a.liq ? r.a.liq.score : null, targetBase: r.a.targetBase,
    idx: r.idx, coin: r.coin, thumb: r.thumb, gradeTxt: r.coin.source === 'quick' ? 'Melt-priced' : gradeLabel(r.coin, r.a.grades) + (r.coin.skipGrade || r.confirmed ? '' : ' (suggested)'),
    liqLabel: r.a.liq ? r.a.liq.label : '',
  }));
  const T = purchaseTotals(items, margin, parseFloat(P.lotOffer) || 0);
  if (feeOn()) {
    const sumFee = (k) => items.reduce((acc, it) => acc + feeOf(it[k]), 0);
    T.feesMid = sumFee('mid');
    T.profitMid = round2(T.profitMid - T.feesMid); T.profitLow = round2(T.profitLow - sumFee('low')); T.profitHigh = round2(T.profitHigh - sumFee('high'));
    T.marginMid = T.mid ? round2(T.profitMid / T.mid) : 0;
    T.maxOffer = Math.max(0, round2(T.maxOffer - sumFee('targetBase')));
    const fp = (+S.settings.fee.pct || 0) / 100, ff = (+S.settings.fee.fixed || 0) * items.length;
    T.requiredSell = round2((T.cost + ff) / Math.max(0.05, 1 - margin - fp));
    T.status = !(T.cost > 0) ? 'Unknown' : T.requiredSell <= T.low ? 'Likely' : T.requiredSell <= T.high ? 'Possible' : 'Unlikely';
  }
  return { ...T, margin };
}

function verdict(T, P) {
  const ask = parseFloat(P.asking);
  if (!(ask > 0)) return '';
  const net = T.mid - (T.feesMid || 0);
  const profit = net - ask, margin = T.mid ? profit / T.mid : 0;
  const gap = ask - T.maxOffer, gapPct = ask ? gap / ask : 0;
  if (ask <= T.maxOffer) return `<div class="feas good"><div class="row between"><b>Buy</b><span class="pill good">Within target</span></div>
    <span class="small">Asking ${money(ask)} is at or under your max offer of ${money(T.maxOffer)}. At their price: profit ~${money(profit)}, ${pct(margin)} margin${feeOn() ? ' ' + feeNote() : ''}.</span></div>`;
  if (profit > 0) return `<div class="feas warn"><div class="row between"><b>Counter at ${money(T.maxOffer)}</b><span class="pill warn">Negotiate</span></div>
    <span class="small">Asking is ${money(gap)} (${pct(gapPct)}) above your max. At their price you'd still make ~${money(profit)}, a ${pct(margin)} margin.</span></div>`;
  return `<div class="feas bad"><div class="row between"><b>Too high</b><span class="pill bad">Walk or push hard</span></div>
    <span class="small">At ${money(ask)} you'd lose ~${money(-profit)}. They'd need to come down ${money(gap)} (${pct(gapPct)}) to hit your target.</span></div>`;
}

function lotCalcInner(T) {

}

async function makeListing() {
  const c = S.coin;
  const a = analyze(c, S.grades, S.confirmed, S.cost, null, S.expSale);
  S.listing = { loading: true }; S.copied = ''; go('listing');
  const payload = {
    name: c.name, country: c.country, denomination: c.denomination, year: c.year, mint: c.mint,
    variety: c.gsVariety != null && c.gsVarieties ? c.gsVarieties[c.gsVariety].name : null,
    km: c.km, composition: c.composition, fineness: c.fineness, weight: c.weight, diameter: c.diameter,
    asw: c.asw, agw: c.agw, slab: c.slab || null, bullion: !!c.skipGrade,
    rarity: c.rarity && (c.rarity.level === 'key' || c.rarity.level === 'semi-key') ? `${RARITY[c.rarity.level]}. ${c.rarity.note}` : null,
    grade: c.slab ? null : (c.skipGrade ? null : (a.confirmed ? gradeLabel(c, a.grades) + ' (raw, seller\'s opinion)' : null)),
  };
  try {
    const res = await fetch('/api/listing', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Access-Code': store.get('cs.code', '') },
      body: JSON.stringify({ coin: payload }),
    });
    const j = await res.json().catch(() => null);
    if (!res.ok || !j || !j.title) throw new Error(j && j.detail ? j.detail : 'The listing service returned an error.');
    S.listing = { ...j, price: listingPrice(a) };
  } catch (e) {
    S.listing = { error: String(e.message || e) + ' Check your connection and try again.' };
  }
  if (S.screen === 'listing') render();
}

function copyText(text, label) {
  const done = () => { S.copied = label; render(); setTimeout(() => { S.copied = ''; if (S.screen === 'listing') render(); }, 1800); };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (_) {} ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

function shrink(file, max, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => cb(null);
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function blobToBase64(b) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(b);
  });
}
/* ---------- verified data: Numista specs + Greysheet CPG ---------- */
const BUCKET = (n) => n >= 60 ? 'UNC' : n >= 50 ? 'AU' : n >= 40 ? 'XF' : n >= 20 ? 'VF' : n >= 12 ? 'F' : n >= 8 ? 'VG' : null;
const NUMISTA_GRADE = { vg: 'VG', f: 'F', vf: 'VF', xf: 'XF', ef: 'XF', au: 'AU', unc: 'UNC', bu: 'UNC' };

function mergeLookup(coin, L) {
  if (!coin || !L) return;
  coin.lookup = L;
  const n = L.numista;
  if (n && n.matched) {
    coin.numista = `N# ${n.id}`; coin.numistaUrl = n.url; coin.numistaTitle = n.title;
    if (n.km) coin.km = n.km;
    if (n.composition) coin.composition = n.composition;
    if (n.weight_g) coin.weight = n.weight_g + ' g';
    if (n.size_mm) coin.diameter = n.size_mm + ' mm';
    if (n.issue && n.issue.mintage) coin.mintage = Number(n.issue.mintage).toLocaleString('en-US');
    coin.refImages = null; // Numista blocks embedding its member photos; link to the Numista page instead
    coin.varieties = n.issue && n.issue.varieties ? n.issue.varieties : null;
    // Numista says no silver or gold: there is no melt value, whatever Claude guessed.
    if (n.composition && !/silver|gold|platinum|palladium|billon/i.test(n.composition)) { coin.asw = null; coin.agw = null; }
    // Recompute precious-metal content from Numista weight + fineness when both are clear.
    const fm = String(n.composition || '').match(/(?:0?\.(\d{3,4}))|(\b9\d{2}\b)/);
    const fine = fm ? parseFloat(fm[1] ? '0.' + fm[1] : '0.' + fm[2]) : null;
    if (n.weight_g && fine && fine > 0.3 && fine <= 1) {
      const pure = Math.round(n.weight_g * fine / 31.1035 * 10000) / 10000;
      if (/gold/i.test(n.composition)) { coin.agw = pure; coin.asw = null; }
      else if (/silver/i.test(n.composition)) { coin.asw = pure; coin.agw = null; }
    }
    const nv = {}, nvLow = {};
    for (const p of n.prices || []) {
      const g = NUMISTA_GRADE[String(p.grade).toLowerCase()]; if (!g) continue;
      nv[g] = Math.max(nv[g] || 0, p.price);
      nvLow[g] = Math.min(nvLow[g] || Infinity, p.low || p.price);
    }
    coin.numistaVal = nv; coin.numistaLow = nvLow;
  }
  const g = L.greysheet;
  if (g && g.prices && g.prices.length && g.name_check !== false) {
    coin.gsName = g.name; coin.gsid = g.gsid; coin.pcgs = g.pcgs;
    coin.gsVarieties = g.varieties && g.varieties.length > 1 ? g.varieties.map((v) => ({ name: v.name, gsid: v.gsid, ...bucketize(v.prices) })) : null;
    coin.gsVariety = null;
    Object.assign(coin, bucketize(g.prices));
  } else if (g && g.prices && g.name_check === false) {
    coin.gsMismatch = g.name;
  }
}

// Greysheet price rows -> per-grade CPG (median), CPG range, wholesale (median).
function bucketize(prices) {
  const by = {}, grey = {};
  for (const r of prices || []) {
    const b = BUCKET(r.grade || parseInt(String(r.label || '').replace(/\D/g, ''), 10) || 0);
    if (!b) continue;
    if (r.cpg) (by[b] = by[b] || []).push(r.cpg);
    if (r.grey) (grey[b] = grey[b] || []).push(r.grey);
  }
  const cpg = Object.fromEntries(Object.entries(by).map(([k, v]) => [k, median(v)]));
  // "Any grade" (bullion-type coins): CPG of the lowest real grade on the table (G4 or better).
  const graded = (prices || []).filter((r) => r.cpg && (r.grade || parseInt(String(r.label || '').replace(/\D/g, ''), 10) || 0) >= 4)
    .sort((a, b) => (a.grade || 0) - (b.grade || 0));
  if (graded.length) cpg.ANY = graded[0].cpg;
  return {
    cpg,
    cpgRange: Object.fromEntries(Object.entries(by).map(([k, v]) => [k, [Math.min(...v), Math.max(...v)]])),
    grey: Object.fromEntries(Object.entries(grey).map(([k, v]) => [k, median(v)])),
  };
}

async function serverJson(hints, images, signal) {
  const payload = { hints: hints || '', images: await Promise.all(images.map(blobToBase64)) };

    method: 'POST', signal,
    headers: { 'Content-Type': 'application/json', 'X-Access-Code': store.get('cs.code', ''), 'X-Tester': store.get('cs.tester', '') },
    body: JSON.stringify(payload),
  }).catch((e) => { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'network' }; });
  if (res.status === 401) throw { code: 'need_code' };
  if (res.status === 413) throw { code: 'image_rejected' };
  if (res.status === 429) throw { code: 'rate_limited' };
  const data = await res.json().catch(() => null);
  if (!res.ok || !data) throw { code: (data && data.error) || 'upstream_error', detail: data ? data.detail : `Server returned ${res.status}` };
  return data;
}

function hintsFromFields() {
  if (!S.fields) return '';
  const f = S.fields, parts = [];
  if (f.country) parts.push('Country: ' + f.country);
  if (f.denomination) parts.push('Denomination: ' + f.denomination);
  if (f.year) parts.push('Year: ' + f.year);
  if (f.mint) parts.push('Mint mark: ' + f.mint);
  return parts.join('\n');
}

const GRADE_MAP = (g) => {
  const x = String(g || '').toUpperCase();
  if (/^(MS|PR|PF|SP|UNC|BU)/.test(x)) return 'UNC';
  if (/^AU/.test(x)) return 'AU';
  if (/^(XF|EF)/.test(x)) return 'XF';
  if (/^VF/.test(x)) return 'VF';
  if (/^F/.test(x)) return 'F';
  if (/^(VG|G|AG|FR|P)/.test(x)) return 'VG';
  return null;
};

function coinFromAI(r) {
  const fieldName = { mint_mark: 'mint', year: 'year', country: 'country', denomination: 'denomination' };
  const num = (v) => (typeof v === 'number' && isFinite(v) && v > 0) ? v : null;
  const sugg = Array.isArray(r.suggested_grades) ? r.suggested_grades.filter((g) => GRADES.includes(g)) : [];
  const mint = r.mint_mark === 'None' ? 'None' + (r.mint_name ? ` (${r.mint_name})` : '') : [r.mint_mark, r.mint_name ? `(${r.mint_name})` : ''].filter(Boolean).join(' ');
  return {
    id: 'ai-' + Date.now(), source: 'ai',
    name: r.coin_name || [r.year, r.country, r.denomination].filter(Boolean).join(' ') || 'Unknown coin',
    country: r.country || '', denomination: r.denomination || '', year: r.year || '', mint,
    composition: r.composition || '', fineness: r.fineness || '',
    weight: num(r.weight_g) ? r.weight_g + ' g' : '', diameter: num(r.diameter_mm) ? r.diameter_mm + ' mm' : '',
    asw: num(r.asw_oz), agw: num(r.agw_oz), mintage: r.mintage || '', km: r.km_number || '',
    numista: 'Matched once Numista is connected',
    category: r.is_bullion_like ? 'Bullion-type' : 'Numismatic',
    uncertain: (r.uncertain_fields || []).map((f) => fieldName[f]).filter(Boolean),
    suggestedGrades: sugg, gradeSensitive: !!r.grade_sensitive, skipGrade: !!r.is_bullion_like,
    cpg: {}, sales: [],
    alternates: (r.candidates || []).filter((x) => x && x.coin_name).slice(0, 4),
    aiValue: r.rough_value_usd && typeof r.rough_value_usd === 'object' ? r.rough_value_usd : {},
    slab: r.slab && (r.slab.service || r.slab.grade) ? r.slab : null,
    gradeNote: r.grade_note || '', confidence: ['High', 'Medium', 'Low'].includes(r.confidence) ? r.confidence : 'Medium',
    photoFeedback: r.photo_feedback || '',
    rarity: r.rarity && RARITY[r.rarity.level] ? { level: r.rarity.level, note: String(r.rarity.note || ''), check: String(r.rarity.check || '') } : null,
  };
}

async function runIdentify(hints, opts = {}) {
  if (SERVER_MODE && !store.get('cs.code', '')) { S.pending = { hints, opts }; return go('code'); }
  const sample = SERVER_MODE ? null : await samplePromise;
  if (!SERVER_MODE && !sample) { S.idUnavailable = true; return go('pick'); }
  const caps = SERVER_MODE ? { images: { maxCount: 2 } } : await sample.limits().catch(() => null);
  const taken = [S.files.obv, S.files.rev].filter(Boolean);
  if (taken.length && !opts.textOnly && !(caps && caps.images)) {
    S.idError = 'This view of Claude can\'t send photos yet. Open this page at claude.ai in Safari or on a computer and scan again. You can also enter the details you can read and search.';
    S.ai = null;
    return go('idfail');
  }
  const images = !opts.textOnly ? taken.slice(0, caps.images.maxCount) : [];
  if (taken.length && !opts.textOnly && !images.length) {
    S.idError = 'The photos couldn\'t be prepared. Try taking them again.';
    return go('idfail');
  }
  idCtl = new AbortController();
  const t0 = Date.now();
  S.screen = 'identifying'; render();
  clearInterval(idTimer);
  idTimer = setInterval(() => { const el = document.getElementById('elapsed'); if (el) el.textContent = Math.round((Date.now() - t0) / 1000); }, 1000);
  try {
    const r = SERVER_MODE
      ? await serverJson(hints, images, idCtl.signal)
      : await sample.json(ID_PROMPT(hints), { images: images.length ? images : undefined, signal: idCtl.signal, modelTier: 'default', cache: false });
    S.idSeconds = Math.round((Date.now() - t0) / 1000);
    S.ai = r; S.idDetail = ''; S.scanId = r.scan_id || null;
    if (!r || r.identified === false || !r.coin_name) {
      S.idError = 'Claude couldn\'t tell what this coin is from these photos.';
      return go('idfail');
    }
    S.coin = coinFromAI(r); S.histAt = Date.now();
    fetchLookup(S.coin, r);
    S.fields = { country: S.coin.country, denomination: S.coin.denomination, year: S.coin.year, mint: S.coin.mint };
    S.expSale = ''; S.cost = ''; S.candidates = false; S.manual = false;
    S.log.push({ at: new Date().toISOString(), hints: hints || '', result: r.coin_name, confidence: r.confidence, seconds: S.idSeconds });
    go(opts.next || 'fields');
  } catch (e) {
    if (e && e.code === 'cancelled') return go('capture');
    if (e && e.code === 'need_code') { store.set('cs.code', ''); S.codeWrong = true; S.pending = { hints, opts }; return go('code'); }
    if (e && e.code === 'images_unavailable') { S.idError = 'This view of Claude can\'t send photos yet. Open this page at claude.ai in Safari or on a computer and scan again.'; S.ai = null; return go('idfail'); }
    S.idError = ID_ERRORS[e && e.code] || 'Something went wrong reaching Claude. Try again.';
    S.idDetail = e && e.detail ? String(e.detail).slice(0, 300) : '';
    go('idfail');
  } finally {
    clearInterval(idTimer);
  }
}
function startIdentify() { runIdentify(''); }
function waitForFiles() {
  return new Promise((resolve) => {
    let n = 0;
    const tick = () => (S.files.obv !== null && S.files.rev !== null) || n++ > 40 ? resolve() : setTimeout(tick, 100);
    setTimeout(tick, 300);
  });
}

// Re-encode any camera photo (HEIC, huge JPEG, etc.) as a standard JPEG Blob.
function toJpegBlob(file, max) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob((b) => resolve(b), 'image/jpeg', 0.9);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled) return;
  const a = t.dataset.a;
  if (a === 'go') return go(t.dataset.s);
  if (a === 'back') return go(prevScreen);
  if (a === 'scan') { Object.assign(S, { sheet: '', paid: null, newLotName: '', lotStatus: 'buy', wrongScanId: null, photos: {}, files: {}, coin: null, fields: null, ai: null, cost: '', expSale: '', added: false, candidates: false, feedback: null, confirmClear: false, manual: false, idUnavailable: false }); return go('capture'); }
  if (a === 'demo') { Object.assign(S, { photos: {}, files: {}, coin: null, cost: '', expSale: '', added: false, candidates: false, feedback: null, idUnavailable: false }); return go('pick'); }
  if (a === 'saveCode') {
    const v = document.getElementById('code').value.trim();
    if (!v) return;
    store.set('cs.code', v); S.codeWrong = false;
    const tn = document.getElementById('tester').value.trim(); if (tn) store.set('cs.tester', tn);
    const p = S.pending || { hints: '', opts: {} }; S.pending = null;
    return runIdentify(p.hints, p.opts);
  }
  if (a === 'frontOnly') return waitForFiles().then(startIdentify);
  if (a === 'stopId') { if (idCtl) idCtl.abort(); return; }
  if (a === 'researchId') { if (S.scanId && !S.wrongScanId) S.wrongScanId = S.scanId; return runIdentify(hintsFromFields(), { textOnly: !S.files.obv }); }
  if (a === 'pickCandidate') {
    const cand = S.coin.alternates[+t.dataset.i];
    if (S.scanId && !S.wrongScanId) S.wrongScanId = S.scanId;
    return runIdentify(`The dealer says this coin is: ${cand.coin_name}. Re-check the photos against that and fill in its details.`, { next: 'match', textOnly: !S.files.obv });
  }
  if (a === 'manual') {
    S.manual = true;
    S.coin = { source: 'ai', uncertain: [], alternates: [] };
    S.fields = S.fields || { country: '', denomination: '', year: '', mint: '' };
    return go('fields');
  }
  if (a === 'pickCoin') {
    S.coin = coinById(t.dataset.id);
    S.fields = { country: S.coin.country, denomination: S.coin.denomination, year: S.coin.year, mint: S.coin.mint };
    return go('fields');
  }
  if (a === 'toMatch') {
    S.candidates = false;
    if (S.manual || !S.coin || !S.coin.name) return runIdentify(hintsFromFields(), { next: 'match', textOnly: !S.files.obv });
    const c = S.coin;
    const edited = c.source === 'ai' && ['country', 'denomination', 'year', 'mint'].some((k) => (S.fields[k] || '') !== (c[k] || ''));
    if (edited) { if (S.scanId && !S.wrongScanId) S.wrongScanId = S.scanId; return runIdentify(hintsFromFields(), { next: 'match' }); }
    return go('match');
  }
  if (a === 'showCandidates') { S.candidates = true; return render(); }
  if (a === 'hideCandidates') { S.candidates = false; return render(); }
  if (a === 'confirmMatch') {
    S.candidates = false;
    if (S.wrongScanId && S.coin && S.coin.name && S.wrongScanId !== S.scanId) {
      sendFeedback({ scan_id: S.wrongScanId, correct: 'no', corrected_to: S.coin.name });
      sendFeedback({ scan_id: S.scanId, correct: 'yes' });
      S.wrongScanId = null;
    }
    if (S.coin.skipGrade) { S.grades = ['ANY']; S.confirmed = true; return go('money'); }
    const slabGrade = S.coin.slab && GRADE_MAP(S.coin.slab.grade);
    if (slabGrade) { S.grades = [slabGrade]; S.confirmed = true; return go('money'); }
    return go('grade');
  }
  if (a === 'setGrade') { S.grades = [t.dataset.g]; S.confirmed = true; return go('money'); }
  if (a === 'useRange') { S.grades = S.coin.suggestedGrades && S.coin.suggestedGrades.length ? [...S.coin.suggestedGrades] : ['F', 'VF']; S.confirmed = false; return go('money'); }
  if (a === 'fb') {
    S.feedback = t.dataset.v;
    if (S.log.length) S.log[S.log.length - 1].correct = t.dataset.v;
    sendFeedback({ scan_id: S.scanId, correct: t.dataset.v });
    if (t.dataset.v === 'no') { S.wrongScanId = S.scanId; return go('fields'); }
    return render();
  }
  if (a === 'sheet') { S.sheet = t.dataset.v; if (S.sheet === 'lot' && !S.lotStatus) S.lotStatus = 'buy'; return render(); }
  if (a === 'lotPick') { S.lotStatus = t.dataset.v; const p = document.getElementById('paid'); if (p) S.paid = p.value; const nl = document.getElementById('newlot'); if (nl) S.newLotName = nl.value; return render(); }
  if (a === 'saveBought' || a === 'saveToLot') {
    const an = analyze(S.coin, S.grades, S.confirmed, S.cost, null, S.expSale);
    const pv = parseFloat((document.getElementById('paid') || {}).value);
    const cost = pv >= 0 ? pv : (an.cost ?? an.targetBuy ?? (an.melt > 0 ? an.melt : 0));
    let lot;
    if (a === 'saveBought') { lot = singlesLot(); lot.items.push(itemFromCurrent(cost, 'buy')); S.added = { kind: 'bought', lot: lot.id, cost }; }
    else {
      if (t.dataset.id === 'new') {
        const nm = (document.getElementById('newlot') || {}).value || '';
        if (!nm.trim()) { const el = document.getElementById('newlot'); if (el) { el.focus(); el.placeholder = 'Name it first, e.g. Table 412'; el.style.borderColor = 'var(--bad)'; } return; }
        lot = newLot(nm);
      } else lot = S.lots.find((l) => l.id === t.dataset.id);
      if (!lot) return;
      const st = S.lotStatus || 'buy';
      lot.items.push(itemFromCurrent(cost, st));
      S.sessionLot = lot.id; S.added = { kind: 'lot', lot: lot.id, status: st };
    }
    lot.updated = Date.now(); S.purchase = lot; S.sheet = ''; S.paid = null; S.newLotName = '';
    save(); return render();
  }
  if (a === 'itemStatus') { S.purchase.items[+t.dataset.i].status = t.dataset.v; S.purchase.updated = Date.now(); save(); return render(); }
  if (a === 'itemListing') {
    const it = S.purchase.items[+t.dataset.i]; if (!it || it.quick) return;
    Object.assign(S, { coin: it.coin || coinById(it.coinId), grades: it.grades || [], confirmed: it.confirmed !== false, expSale: it.expSale || '', cost: String(it.cost || ''), photos: { thumb: it.thumb }, listingBack: 'purchase' });
    return makeListing();
  }
  if (a === 'pickVariety') {
    const v = S.coin.gsVarieties[+t.dataset.i];
    S.coin.gsVariety = +t.dataset.i; S.coin.gsName = v.name; S.coin.gsid = v.gsid;
    S.coin.cpg = v.cpg; S.coin.cpgRange = v.cpgRange; S.coin.grey = v.grey;
    return render();
  }
  if (a === 'listing') { S.listingBack = 'money'; return makeListing(); }
  if (a === 'listingRedo') return makeListing();
  if (a === 'copy') {
    const val = (id) => (document.getElementById(id) || {}).value || '';
    const title = val('lt'), desc = val('ld'), specs = val('ls'), price = val('lp');
    Object.assign(S.listing, { title, price });
    const what = t.dataset.what;
    if (what === 'title') return copyText(title, 'title');
    if (what === 'specs') return copyText(specs, 'item specifics');
    if (what === 'desc') return copyText(desc, 'description');
    return copyText(`${title}\n\nPrice: $${price}\n\n${specs}\n\n${desc}`, 'listing');
  }
  if (a === 'quickPick') { S.quick = { ...(S.quick || {}), id: t.dataset.id }; return render(); }
  if (a === 'quickAdd') {
    const Q = S.quick; const m = melt(quickCoin(Q), spot());
    if (!(m > 0)) return;
    S.purchase.items.push({ quick: { id: Q.id, qty: +Q.qty }, grades: ['ANY'], confirmed: true, cost: Math.round(m * (+Q.pct || 0)) / 100, status: 'buy' });
    S.purchase.updated = Date.now(); if (S.purchase.kind !== 'singles') S.sessionLot = S.purchase.id;
    save(); S.quick = { ...Q, qty: '' }; return go('purchase');
  }
  if (a === 'removeItem') { S.purchase.items.splice(+t.dataset.i, 1); save(); return render(); }
  if (a === 'newLot') { newLot(); S.sessionLot = S.purchase.id; S.confirmClear = false; return go('purchase'); }
  if (a === 'openLot') { const L = S.lots.find((l) => l.id === t.dataset.id); if (!L) return; S.purchase = L; if (L.kind !== 'singles') S.sessionLot = L.id; S.confirmClear = false; return go('purchase'); }
  if (a === 'lotStatus') { S.purchase.status = t.dataset.v; save(); return render(); }
  if (a === 'deleteLot') {
    S.lots = S.lots.filter((l) => l.id !== S.purchase.id);
    if (S.sessionLot === S.purchase.id) S.sessionLot = null;
    S.purchase = S.lots[0] || null;
    S.confirmClear = false; save(); return go('lots');
  }
  if (a === 'openHist') {
    const h = S.history.find((x) => x.id === t.dataset.id); if (!h) return;
    Object.assign(S, { coin: { ...h.coin }, grades: h.grades || [], confirmed: h.confirmed, expSale: h.expSale || '', cost: '', added: false, sheet: '', paid: null, feedback: 'n/a', photos: { thumb: h.thumb }, files: {}, scanId: null, histAt: h.at });
    return go('money');
  }
  if (a === 'clearHistory') { S.history = []; S.confirmClear = false; save(); return render(); }
  if (a === 'feeChannel') {
    const ch = t.dataset.ch; S.settings.fee.channel = ch;
    if (FEE_PRESETS[ch]) { S.settings.fee.pct = FEE_PRESETS[ch].pct; S.settings.fee.fixed = FEE_PRESETS[ch].fixed; }
    save(); return render();
  }
  if (a === 'askClear') { S.confirmClear = true; return render(); }
  if (a === 'cancelClear') { S.confirmClear = false; return render(); }

  if (a === 'saveSettings') {
    const v = (id) => parseFloat(document.getElementById(id).value);
    if (v('mn') >= 0 && v('mn') < 100) S.settings.marginNumis = v('mn') / 100;
    if (v('mb') >= 0 && v('mb') < 100) S.settings.marginBullion = v('mb') / 100;
    if (v('ss') > 0) S.settings.spot.silver = v('ss');
    if (v('sg') > 0) S.settings.spot.gold = v('sg');
    S.settings.spot.asOf = 'Sample spot, edited';
    const admEl = document.getElementById('adm'); if (admEl) store.set('cs.admin', admEl.value.trim());
    const footEl = document.getElementById('foot'); if (footEl) store.set('cs.footer', footEl.value.trim());
    if (S.settings.fee.channel !== 'none') { S.settings.fee.pct = v('fpct') >= 0 ? v('fpct') : 0; S.settings.fee.fixed = v('ffix') >= 0 ? v('ffix') : 0; }
    save(); return go(prevScreen);
  }
});

document.addEventListener('toggle', (e) => { if (e.target && e.target.id === 'more') S.moreOpen = e.target.open; }, true);

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.field) { S.fields[el.dataset.field] = el.value; return; }
  if (el.id === 'cost') {
    S.cost = el.value;
    const a = analyze(S.coin, S.grades, S.confirmed, S.cost, null, S.expSale);
    const calc = document.getElementById('calc');
    const pos = el.selectionStart;
    calc.innerHTML = calcInner(S.coin, a);

    const ni = document.getElementById('cost'); ni.focus(); try { ni.setSelectionRange(pos, pos); } catch (_) {}
    return;
  }
  if (el.id === 'qq' || el.id === 'qp') {
    S.quick[el.id === 'qq' ? 'qty' : 'pct'] = el.value;
    const m = (+S.quick.qty > 0) ? melt(quickCoin(S.quick), spot()) : 0;
    document.getElementById('qcalc').innerHTML = quickCalc(m, m * (+S.quick.pct || 0) / 100);
    document.getElementById('qadd').disabled = !(m > 0);
    return;
  }
  if (el.id === 'lt') { const tc = document.getElementById('tcount'); if (tc) tc.textContent = el.value.length + '/80'; return; }
  if (el.id === 'expsale') {
    S.expSale = el.value;
    return;
  }
  if (el.id === 'paid') { S.paid = el.value; return; }
  if (el.id === 'newlot') { S.newLotName = el.value; return; }
  if (el.id === 'lotname') { S.purchase.name = el.value || 'Lot'; save(); return; }
  if (el.id === 'lotnotes') { S.purchase.notes = el.value; save(); return; }
  if (el.dataset && el.dataset.inote != null) { S.purchase.items[+el.dataset.inote].note = el.value; save(); return; }
  if (el.id === 'asking') {
    S.purchase.asking = el.value; save();
    const box = document.getElementById('lotcalc'); box.innerHTML = lotCalcInner(lotTotals());
    const ni = document.getElementById('asking'); ni.focus(); try { ni.setSelectionRange(ni.value.length, ni.value.length); } catch (_) {}
    return;
  }
  if (el.id === 'lot') {
    S.purchase.lotOffer = el.value; save();
    const box = document.getElementById('lotcalc');
    box.innerHTML = lotCalcInner(lotTotals());
    const ni = document.getElementById('lot'); ni.focus();
    return;
  }
  if (el.id === 'lm') {
    S.purchase.lotMargin = parseFloat(el.value); save();
    document.getElementById('lmv').textContent = pct(S.purchase.lotMargin);
    return;
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if ((el.id === 'cam' || el.id === 'lib') && el.files && el.files[0]) {
    const side = S.photos.obv ? 'rev' : 'obv';
    const file = el.files[0];
    S.files[side] = null;
    toJpegBlob(file, 1600).then((b) => { S.files[side] = b; });
    shrink(file, 900, (url) => {
      if (!url) return;
      S.photos[side] = url;
      if (side === 'obv') shrink(file, 96, (th) => { S.photos.thumb = th; });
      render();
      if (side === 'rev') waitForFiles().then(startIdentify);
    });
  }
  if (el.dataset.cost != null) {
    const i = +el.dataset.cost, v = parseFloat(el.value);
    if (v >= 0) { S.purchase.items[i].cost = v; save(); render(); }
  }
  if (el.id === 'lm') render();
  if (el.id === 'expsale') render();
});

// Live spot (standalone app): replaces the sample spot when available.
async function loadSpot() {
  if (!SERVER_MODE) return;
  try {
    const j = await (await fetch('/api/spot')).json();
    if (j && j.ok) {
      const t = new Date(j.asOf);
      S.settings.spot = { silver: j.silver, gold: j.gold, live: true,
        asOf: 'Live, metals.dev' + (isNaN(t) ? '' : ' · ' + t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })) };
      save();
      if (!['capture', 'identifying'].includes(S.screen)) render();
    } else if (j && j.error) {
      S.spotError = j.error;
    }
  } catch (_) {}
}
loadSpot();
setInterval(loadSpot, 10 * 60 * 1000);

render();
